  <title>Macro Phases</title>
  <style>
:root {
  color-scheme: light;
  --ink: #17211b;
  --muted: #667269;
  --line: #dfe6df;
  --paper: #fbfcf8;
  --panel: #ffffff;
  --accent: #16735f;
  --accent-dark: #0f5143;
  --gold: #c89021;
  --blue: #386fa4;
  --danger: #a63d40;
  --under-goal: #b9413f;
  --soft: #e9f5ee;
  --soft-2: #d6eadf;
  --bottom: #10231d;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
[data-theme="ocean"] {
  --ink: #142126;
  --muted: #61737a;
  --line: #a9d4dd;
  --paper: #e8f8fb;
  --panel: #f8feff;
  --accent: #0085a8;
  --accent-dark: #004f66;
  --gold: #d99c22;
  --blue: #245dd8;
  --danger: #a63d40;
  --under-goal: #b33f32;
  --soft: #d8f0f5;
  --soft-2: #bfe5ed;
  --bottom: #063342;
}
[data-theme="original"] {
  --ink: #1f2933;
  --muted: #5f6b76;
  --line: #dfcfaa;
  --paper: #fff4d9;
  --panel: #fffdf6;
  --accent: #00a88f;
  --accent-dark: #006b5d;
  --gold: #ffb000;
  --blue: #2962ff;
  --danger: #e53935;
  --under-goal: #d7263d;
  --soft: #ffedb8;
  --soft-2: #b8f3df;
  --bottom: #16324f;
}
[data-theme="forest"] {
  --ink: #17211b;
  --muted: #667269;
  --line: #bdd7c6;
  --paper: #edf8ef;
  --panel: #fbfffb;
  --accent: #0f805f;
  --accent-dark: #084d39;
  --gold: #c99118;
  --blue: #2c689b;
  --danger: #a63d40;
  --under-goal: #b9413f;
  --soft: #dcefe2;
  --soft-2: #c4e3cf;
  --bottom: #0b2d20;
}
[data-theme="sunrise"] {
  --ink: #2a211d;
  --muted: #77675e;
  --line: #efc5af;
  --paper: #fff1e8;
  --panel: #fffaf6;
  --accent: #d84f22;
  --accent-dark: #873015;
  --gold: #e09a16;
  --blue: #267aa0;
  --danger: #a33b42;
  --under-goal: #087f6f;
  --soft: #ffe0d0;
  --soft-2: #f8c9af;
  --bottom: #4d2215;
}
[data-theme="berry"] {
  --ink: #241b2c;
  --muted: #71657a;
  --line: #d8badd;
  --paper: #fbecff;
  --panel: #fff8ff;
  --accent: #a73583;
  --accent-dark: #672052;
  --gold: #d08d18;
  --blue: #4368c4;
  --danger: #a63d40;
  --under-goal: #15806f;
  --soft: #f1d7f4;
  --soft-2: #e5c1eb;
  --bottom: #311738;
}
[data-theme="graphite"] {
  --ink: #1d2227;
  --muted: #68717a;
  --line: #c3cbd2;
  --paper: #edf1f4;
  --panel: #fbfcfd;
  --accent: #3f5f7a;
  --accent-dark: #24394b;
  --gold: #c48d1f;
  --blue: #167ca5;
  --danger: #a64045;
  --under-goal: #b24a35;
  --soft: #dde5eb;
  --soft-2: #cdd8e0;
  --bottom: #1f2d38;
}
[data-theme="dark"] {
  color-scheme: dark;
  --ink: #edf4ef;
  --muted: #a9b8af;
  --line: #416054;
  --paper: #0d1410;
  --panel: #17281f;
  --accent: #41d3ac;
  --accent-dark: #94ead6;
  --gold: #efb94d;
  --blue: #63aef2;
  --danger: #ff8a8f;
  --under-goal: #ffbd59;
  --soft: #dbeee6;
  --soft-2: #bfe4d6;
  --bottom: #050907;
}
[data-theme="dark"] .macro span,
[data-theme="dark"] .macro b,
[data-theme="dark"] .servings input,
[data-theme="dark"] .servings button,
[data-theme="dark"] .goal-actions .mini {
  color: #000000;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--soft) 0, var(--paper) 220px);
  color: var(--ink);
}
button, input, select { font: inherit; }
button,
[data-view-target],
[data-training-day],
.tab,
.home-card,
.cal-cell {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .14s ease, border-color .14s ease, color .14s ease, transform .08s ease, filter .14s ease, box-shadow .14s ease;
}
button:hover,
.home-card:hover,
.tab:hover,
.cal-cell:hover {
  filter: brightness(1.04) saturate(1.08);
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
}
button:active,
.home-card:active,
.tab:active,
.cal-cell:active {
  transform: scale(.985);
  filter: brightness(.96) saturate(1.12);
}
.app {
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 112px;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: -16px -16px 12px;
  padding: 14px 16px 12px;
  background: color-mix(in srgb, var(--paper) 82%, var(--soft));
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
}
h1 {
  margin: 0;
  font-size: 1.2rem;
  letter-spacing: 0;
}
.phase-select, .theme-select {
  width: 100%;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  padding: 12px;
}
.theme-select {
  margin-top: 0;
  max-width: 168px;
  padding: 9px 10px;
}
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 0 2px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.favorite-empty {
  color: var(--muted);
  font-size: .78rem;
  padding: 10px 2px 2px;
}
.tab {
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 74%, var(--soft));
  color: var(--muted);
  border-radius: 999px;
  padding: 9px 12px;
  white-space: nowrap;
}
.tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.top-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}
.favorite-toggle.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #1f1704;
}
.summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 12px 0;
}
.home-hero {
  background: linear-gradient(135deg, var(--panel), color-mix(in srgb, var(--panel) 46%, var(--soft)));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin: 10px 0;
}
.home-hero h2 {
  margin: 0;
  font-size: 1.15rem;
}
.home-hero p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: .82rem;
}
.profile-top {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: start;
}
.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--accent);
  color: white;
  font-weight: 900;
  font-size: 1rem;
}
.profile-actions {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}
.profile-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}
.profile-form label {
  display: grid;
  gap: 4px;
}
.profile-form label span {
  color: var(--muted);
  font-size: .7rem;
}
.profile-form input,
.profile-form select {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: color-mix(in srgb, var(--panel) 82%, var(--soft));
  color: var(--ink);
}
.profile-form .full {
  grid-column: 1 / -1;
}
.login-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin-top: 12px;
}
.login-row input {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px;
  background: color-mix(in srgb, var(--panel) 82%, var(--soft));
  color: var(--ink);
}
.home-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.home-card {
  width: 100%;
  text-align: left;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  border-radius: 8px;
  padding: 16px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, var(--panel)), color-mix(in srgb, var(--panel) 45%, var(--soft)));
  color: var(--ink);
  min-height: 126px;
  box-shadow: 0 8px 20px rgba(0,0,0,.07);
}
.home-card strong {
  display: block;
  font-size: 1.08rem;
}
.home-card span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: .8rem;
}
.archive-section {
  margin: 12px 0 0;
  border: 1px dashed color-mix(in srgb, var(--muted) 45%, var(--line));
  border-radius: 8px;
  padding: 12px;
  background: color-mix(in srgb, var(--panel) 66%, var(--soft));
}
.archive-section h2 {
  margin: 0;
  font-size: .98rem;
}
.archive-section p {
  margin: 4px 0 10px;
  color: var(--muted);
  font-size: .8rem;
}
.archive-section summary {
  cursor: pointer;
  font-weight: 850;
}
.archive-section summary::marker {
  color: var(--accent);
}
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 10px 0;
}
.stat-grid .metric {
  padding: 9px;
}
.stat-grid .metric strong {
  font-size: 1.05rem;
}
.cal-weekdays,
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
  margin-top: 10px;
}
.cal-weekdays span {
  text-align: center;
  color: var(--muted);
  font-size: .68rem;
}
.cal-cell {
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: color-mix(in srgb, var(--panel) 78%, var(--soft));
  color: var(--ink);
  display: grid;
  place-items: center;
  padding: 4px;
}
.cal-cell.muted {
  border-color: transparent;
  background: transparent;
}
.cal-cell.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.cal-cell small {
  min-height: 12px;
  font-size: .62rem;
  font-weight: 800;
}
.month-summary {
  margin-top: 14px;
  display: grid;
  gap: 8px;
}
.month-summary h3 {
  margin: 0;
  font-size: .9rem;
}
.month-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px;
  background: color-mix(in srgb, var(--panel) 76%, var(--soft));
}
.month-row strong {
  font-size: .86rem;
}
.month-pill {
  min-width: 48px;
  border-radius: 999px;
  padding: 5px 8px;
  text-align: center;
  font-size: .76rem;
  font-weight: 850;
  background: var(--soft-2);
  color: var(--accent-dark);
}
.month-pill.cardio {
  background: color-mix(in srgb, var(--blue) 18%, var(--panel));
  color: var(--blue);
}
.metric {
  background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 72%, var(--soft)));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.metric span {
  display: block;
  color: var(--muted);
  font-size: .76rem;
}
.metric strong {
  display: block;
  margin-top: 4px;
  font-size: 1.25rem;
}
.macro-chart {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 112px 1fr;
  gap: 14px;
  align-items: center;
  margin: 12px 0;
  background: linear-gradient(135deg, var(--panel), color-mix(in srgb, var(--panel) 62%, var(--soft)));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.donut {
  width: 112px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: conic-gradient(var(--gold) 0 var(--fat-end), var(--blue) var(--fat-end) var(--carb-end), var(--accent) var(--carb-end) 100%);
  display: grid;
  place-items: center;
}
.donut::after {
  content: "";
  width: 64px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--panel);
  box-shadow: inset 0 0 0 1px var(--line);
}
.chart-copy strong {
  display: block;
  font-size: 1.1rem;
}
.chart-copy span {
  display: block;
  color: var(--muted);
  font-size: .78rem;
  margin-top: 2px;
}
.goal-actions {
  margin-top: 10px;
}
.goal-grid {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.goal-card {
  background: color-mix(in srgb, var(--panel) 70%, var(--soft));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px;
}
.goal-card span {
  display: block;
  color: var(--muted);
  font-size: .68rem;
}
.goal-card strong {
  display: block;
  margin-top: 3px;
}
.goal-card small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
}
.goal-card.under {
  border-color: color-mix(in srgb, var(--under-goal) 62%, var(--line));
}
.goal-card.under strong,
.goal-card.under small {
  color: var(--under-goal);
}
.goal-card.over {
  border-color: color-mix(in srgb, var(--accent) 62%, var(--line));
}
.goal-card.over strong,
.goal-card.over small {
  color: var(--accent-dark);
}
.bar {
  height: 6px;
  overflow: hidden;
  background: var(--soft-2);
  border-radius: 999px;
  margin-top: 7px;
}
.bar i {
  display: block;
  height: 100%;
  width: min(var(--fill), 100%);
  background: var(--accent);
  border-radius: inherit;
}
.goal-card.under .bar i {
  background: var(--under-goal);
}
.goal-card.over .bar i {
  background: var(--accent);
}
.legend {
  display: grid;
  gap: 6px;
  margin-top: 10px;
}
.legend-row {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  gap: 8px;
  align-items: center;
  color: var(--muted);
  font-size: .78rem;
}
.swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.swatch.fat { background: var(--gold); }
.swatch.carbs { background: var(--blue); }
.swatch.protein { background: var(--accent); }
.toolbar {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin: 12px 0;
}
.search {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  background: color-mix(in srgb, var(--panel) 82%, var(--soft));
}
.ghost {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 12px;
  background: color-mix(in srgb, var(--panel) 76%, var(--soft));
  color: var(--accent-dark);
}
.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0;
}
.action-row.compact {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.active-toggle.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.primary {
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 12px;
  background: var(--accent);
  color: white;
}
.section-label {
  grid-column: 1 / -1;
  color: var(--muted);
  font-size: .78rem;
  font-weight: 750;
  padding: 4px 2px 0;
  text-transform: uppercase;
}
.slot-card {
  grid-column: 1 / -1;
  background: color-mix(in srgb, var(--panel) 74%, var(--soft));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.slot-card h3 {
  margin: 0 0 8px;
  font-size: .95rem;
}
.meal-slot-card {
  display: grid;
  gap: 13px;
}
.meal-slot-card h3 {
  font-size: 1.16rem;
  letter-spacing: 0;
}
.slot-items {
  display: grid;
  gap: 8px;
}
.slot-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  border-top: 1px solid var(--line);
  padding-top: 8px;
  color: var(--muted);
  font-size: .82rem;
}
.dessert-image {
  height: 132px;
  border-radius: 8px;
  margin: -2px -2px 10px;

function canonicalName(name) {
  const cleaned = String(name || "").trim().replace(/\s+/g, " ");
  const key = cleaned.toLowerCase();
  const aliases = {
    "grd tky": "Ground Turkey",
    "ground turk": "Ground Turkey",
    "ground tky": "Ground Turkey",
    "protein pwd": "Protein Powder",
    "pb2": "PB Powder",
    "pb powder": "PB Powder",
    "cottage ch": "Cottage Cheese",
    "cottage chse": "Cottage Cheese",
    "shrd cheese": "Shredded Cheese",
    "shrd m cheese": "Shredded Mexican Cheese",
    "russet pot": "Russet Potato",
    "broc": "Broccoli",
    "broccili": "Broccoli",
    "broccli": "Broccoli",
    "crsuhed tom": "Crushed Tomato",
    "crushed tom": "Crushed Tomato",
    "tom": "Tomato",
    "tom ch": "Tomatoes",
    "pinot beans": "Pinto Beans",
    "pinto": "Pinto Beans",
    "bb": "Blueberries",
    "egg white": "Egg Whites",
    "egg whites": "Egg Whites",
    "egg": "Eggs",
    "milk": "Almond Milk",
    "zuccini": "Zucchini",
    "vegs": "Vegetables",
    "marina": "Marinara"
  };
  return aliases[key] || cleaned.replace(/\b\w/g, (char) => char.toUpperCase());
}

function prepareData(phases) {
  return phases.map((phase, phaseIndex) => {
    const used = {};
    const phaseId = phase.id || `${slug(phase.name)}-${phaseIndex}`;
    return {
      ...phase,
      id: phaseId,
      targets: { ...DEFAULT_TARGETS, ...(phase.targets || {}) },
      items: (phase.items || []).map((item, itemIndex) => {
        const base = slug(item.name);
        used[base] = (used[base] || 0) + 1;
        return {
          id: item.id || `${base}-${used[base]}-${itemIndex}`,
          name: canonicalName(item.name || "New food"),
          category: item.category || "",
          servings: parseNumber(item.servings),
          calories: parseNumber(item.calories),
          fat: parseNumber(item.fat),
          carbs: parseNumber(item.carbs),
          protein: parseNumber(item.protein)
        };
      })
    };
  });
}

function totalsFor(phase, items = phase.items) {
  return items.reduce((totals, item) => {
    const servings = getServings(phase, item);
    totals.calories += item.calories * servings;
    totals.fat += item.fat * servings;
    totals.carbs += item.carbs * servings;
    totals.protein += item.protein * servings;
    totals.servings += servings;
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0, servings: 0 });
}

function macroCalories(totals) {
  const fat = totals.fat * 9;
  const carbs = totals.carbs * 4;
  const protein = totals.protein * 4;
  const total = fat + carbs + protein || 1;
  return {
    fat,
    carbs,
    protein,
    total,
    fatPct: fat / total * 100,
    carbsPct: carbs / total * 100,
    proteinPct: protein / total * 100
  };
}

function foodKey(item) {
  return `${item.name.trim().toLowerCase()}|${item.calories}|${item.fat}|${item.carbs}|${item.protein}`;
}

function foodLibrary() {
  const map = new Map();
  const deleted = new Set(state.deletedFoodKeys || []);
  DATA.forEach((phase) => {
    phase.items.forEach((item) => {
      const key = foodKey(item);
      if (deleted.has(key)) return;
      if (!map.has(key)) map.set(key, { ...item, sources: [phase.name] });
      else map.get(key).sources.push(phase.name);
    });
  });
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
}

function normalizedFoodName(value) {
  return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function findTemplateFood(component) {
  const library = foodLibrary();
  const preferredKey = state.mealFoodKeys?.[normalizedFoodName(component.name)];
  if (preferredKey) {
    const preferred = library.find((item) => foodKey(item) === preferredKey);
    if (preferred) return preferred;
  }
  return library.find((item) => mealComponentMatchesItem(component, item));
}

function ensureMealTemplateFoods() {
  const bank = foodBankPhase();
  if (!bank || bank.__seededMealFoods) return;
  const library = foodLibrary();
  const deleted = new Set(state.deletedFoodKeys || []);
  const missing = TEMPLATE_FOOD_DEFAULTS.filter((food) => {
    const foodName = normalizedFoodName(food.name);
    return !deleted.has(foodKey({ ...food, servings: 0 })) && !library.some((item) => normalizedFoodName(item.name) === foodName);
  });
  if (missing.length) {
    missing.forEach((food) => {
      bank.items.push({
        id: `${slug(food.name)}-meal-bank-${Date.now()}-${bank.items.length}`,
        servings: 0,
        ...food
      });
    });
    saveData();
  }
  bank.__seededMealFoods = true;
}

function mealComponentMatchesItem(component, item) {
  const itemName = normalizedFoodName(item.name);
  return component.aliases.some((alias) => {
    const aliasName = normalizedFoodName(alias);
    return itemName === aliasName || (aliasName.length > 3 && itemName.includes(aliasName));
  });
}

function componentMatchesFood(component, item) {
  const itemName = normalizedFoodName(item.name);
  const componentName = normalizedFoodName(component.name);
  return componentName === itemName || mealComponentMatchesItem({ ...component, aliases: [...(component.aliases || []), component.name] }, item);
}

function slotTotals(slot) {
  return mealInstancesForSlot(slot).reduce((totals, instance) => {
    const meal = mealById(instance.mealId);
    if (!meal) return totals;
    const mealTotals = mealMacroTotals(mealMatchesFor(instance.id, meal));
    totals.calories += mealTotals.calories;
    totals.fat += mealTotals.fat;
    totals.carbs += mealTotals.carbs;
    totals.protein += mealTotals.protein;
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0 });
}

function deleteFoodFromBank(itemKey) {
  const libraryItem = foodLibrary().find((item) => foodKey(item) === itemKey);
  if (!libraryItem) return false;
  let removed = false;
  state.deletedFoodKeys = [...new Set([...(state.deletedFoodKeys || []), itemKey])];
  DATA.forEach((phase) => {
    const before = phase.items.length;
    phase.items = phase.items.filter((item) => foodKey(item) !== itemKey);
    if (phase.items.length !== before) removed = true;
  });
  const customMealIdsBefore = new Set(state.customMeals.map((meal) => meal.id));
  state.customMeals = state.customMeals.map((meal) => ({
    ...meal,
    items: meal.items.filter((component) => !componentMatchesFood(component, libraryItem))
  })).filter((meal) => meal.items.length);
  const customMealIdsAfter = new Set(state.customMeals.map((meal) => meal.id));
  const removedMealIds = [...customMealIdsBefore].filter((mealId) => !customMealIdsAfter.has(mealId));
  if (removedMealIds.length) {
    Object.keys(state.mealSlots).forEach((slot) => {
      state.mealSlots[slot] = mealInstancesForSlot(slot).filter((instance) => !removedMealIds.includes(instance.mealId));
    });
    localStorage.setItem(MEAL_SLOT_KEY, JSON.stringify(state.mealSlots));
  }
  Object.keys(state.mealServings).forEach((key) => {
    if (key.endsWith(`::${slug(libraryItem.name)}`)) delete state.mealServings[key];
  });
  Object.entries(state.mealFoodKeys || {}).forEach(([componentKey, linkedKey]) => {
    if (linkedKey === itemKey) delete state.mealFoodKeys[componentKey];
  });
  saveData();
  saveCustomMeals();
  localStorage.setItem(MEAL_PLAN_KEY, JSON.stringify(state.mealServings));
  localStorage.setItem(DELETED_FOOD_KEY, JSON.stringify(state.deletedFoodKeys));
  localStorage.setItem(MEAL_FOOD_KEY, JSON.stringify(state.mealFoodKeys));
  return removed;
}

function editFoodInBank(oldKey, itemData) {
  const oldItem = foodLibrary().find((item) => foodKey(item) === oldKey);
  if (!oldItem) return false;
  const usedComponents = [];
  savedMeals().forEach((meal) => {
    meal.items.forEach((component) => {
      const matched = findTemplateFood(component);
      if (matched && foodKey(matched) === oldKey) usedComponents.push(component);
    });
  });
  let updated = false;
  DATA.forEach((phase) => {
    phase.items = phase.items.map((item) => {
      if (foodKey(item) !== oldKey) return item;
      updated = true;
      return { ...item, ...itemData, id: item.id };
    });
  });
  if (!updated) {
    foodBankPhase().items.push({ ...itemData, id: `${slug(itemData.name)}-${Date.now()}` });
  }
  const newKey = foodKey(itemData);
  usedComponents.forEach((component) => {
    state.mealFoodKeys[normalizedFoodName(component.name)] = newKey;
  });
  state.deletedFoodKeys = (state.deletedFoodKeys || []).filter((key) => key !== oldKey && key !== newKey);
  saveData();
  localStorage.setItem(MEAL_FOOD_KEY, JSON.stringify(state.mealFoodKeys));
  localStorage.setItem(DELETED_FOOD_KEY, JSON.stringify(state.deletedFoodKeys));
  return true;
}

function mealUsageForFood(item) {
  const itemKey = foodKey(item);
  const meals = savedMeals().filter((meal) => meal.items.some((component) => {
    const matched = findTemplateFood(component);
    return matched && foodKey(matched) === itemKey;
  }));
  return meals.map((meal) => meal.name);
}

function mealServingKey(instanceId, component) {
  return `${instanceId}::${slug(component.name)}`;
}

function getMealServing(instanceId, component) {
  const key = mealServingKey(instanceId, component);
  return state.mealServings[key] ?? component.servings ?? 0;
}

function setMealServing(key, value) {
  const parsed = Math.max(0, Math.round(parseNumber(value) * 10) / 10);
  state.mealServings[key] = parsed;
  localStorage.setItem(MEAL_PLAN_KEY, JSON.stringify(state.mealServings));
  if (state.view === "meal" || state.view === "phase") renderMealPlan();
  else {
    renderSummary();
    renderItems();
  }
}

function mealMacroTotals(matches) {
  return matches.reduce((totals, match) => {
    totals.calories += match.item.calories * match.servings;
    totals.fat += match.item.fat * match.servings;
    totals.carbs += match.item.carbs * match.servings;
    totals.protein += match.item.protein * match.servings;
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0 });
}

function mealMatchesFor(instanceId, meal) {
  return meal.items.map((component) => {
    const item = findTemplateFood(component);
    if (!item) return null;
    return {
      item,
      component,
      key: mealServingKey(instanceId, component),
      servings: getMealServing(instanceId, component)
    };
  }).filter(Boolean);
}

function mealInstancesForSlot(slot) {
  const raw = state.mealSlots[slot];
  if (Array.isArray(raw)) return raw;
  if (typeof raw === "string" && raw) {
    const migrated = [{ id: `${slug(slot)}-${slug(raw)}-legacy`, mealId: raw }];
    state.mealSlots[slot] = migrated;
    localStorage.setItem(MEAL_SLOT_KEY, JSON.stringify(state.mealSlots));
    return migrated;
  }
  return [];
}

function dailyMealTotals() {
  return MEAL_PLAN_SLOTS.reduce((totals, slot) => {
    mealInstancesForSlot(slot).forEach((instance) => {
      const meal = mealById(instance.mealId);
      if (!meal) return;
      const matches = mealMatchesFor(instance.id, meal);
      const mealTotals = mealMacroTotals(matches);
      totals.calories += mealTotals.calories;
      totals.fat += mealTotals.fat;
      totals.carbs += mealTotals.carbs;
      totals.protein += mealTotals.protein;
      totals.servings += matches.reduce((sum, match) => sum + match.servings, 0);
    });
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0, servings: 0 });
}

function mealItemRow(match) {
  const totals = {
    calories: match.item.calories * match.servings,
    fat: match.item.fat * match.servings,
    carbs: match.item.carbs * match.servings,
    protein: match.item.protein * match.servings
  };
  return `
    <div class="meal-row">
      <div class="meal-row-name">
        <strong>${esc(match.item.name)}</strong>
        <span>${fmt(match.item.calories)} cal each</span>
      </div>
      <div class="meal-row-right">
        <div class="meal-row-macros">${fmt(totals.calories)} cal - F ${fmt(totals.fat)}g - C ${fmt(totals.carbs)}g - P ${fmt(totals.protein)}g</div>
        <div class="servings" aria-label="Daily servings for ${esc(match.item.name)}">
          <button data-meal-step="-0.5" data-meal-key="${esc(match.key)}" aria-label="Remove meal serving">-</button>
          <input inputmode="decimal" value="${fmt(match.servings)}" data-meal-input="${esc(match.key)}" aria-label="Daily meal servings">
          <button data-meal-step="0.5" data-meal-key="${esc(match.key)}" aria-label="Add meal serving">+</button>
        </div>
      </div>
    </div>
  `;
}

function foodGroup(item) {
  const rawCategory = String(item.category || "").toLowerCase();
  const name = String(item.name || "").toLowerCase();
  const text = `${rawCategory} ${name}`;
  if (/\b(protein powder|protein pwd|pb powder|pb2|supplement)\b/.test(text)) return "Supplements";
  if (/\b(egg|eggs|egg white|chicken|turkey|tky|grd tky|ground turk|ground beef|beef|meat)\b/.test(text)) return "Protein";
  if (/\b(milk|almond milk|yogurt|greek yogurt|cottage|cheese|dairy)\b/.test(text)) return "Dairy";
  if (/\b(rice|cream of rice|grits|oat|oatmeal|pasta|bagel|bagels|bread|popcorn|rice cake|pot|russet|grain|granola)\b/.test(text)) return "Grains & Starches";
  if (/\b(banana|blueberries|berries|strawberries|mango|raisins|fruit|bb|frozen fruit)\b/.test(text)) return "Fruit";
  if (/\b(spinach|broc|broccoli|broccili|broccli|tom|tomato|crushed tom|petite diced|pepper|onion|beans|pinto|pinot|green beans|corn|carrot|squash|zucchini|zuccini|veg|vegs)\b/.test(text)) return "Vegetables";
  if (/\b(ketchup|sauce|marina|marinara|broth|misc|other)\b/.test(text)) return "Fats, Sauces & Extras";
  return "Other";
}

function groupedListHtml(phase, items, options = {}) {
  if (!items.length) return "";
  const groups = new Map(GROUP_ORDER.map((group) => [group, []]));
  items.forEach((item) => {
    const group = foodGroup(item);
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(item);
  });
  return [...groups.entries()]
    .filter(([, groupItems]) => groupItems.length)
    .map(([group, groupItems]) => `
      <div class="food-group">${esc(group)}</div>
      ${groupItems.map((item) => itemCard(phase, item, options)).join("")}
    `)
    .join("");
}

function mealListHtml(phase, items) {
  return groupedListHtml(phase, items);
}

  const themes = [

function favoriteTabs(phase) {
  const favorites = state.favoriteIds.map((id) => DATA.find((entry) => entry.id === id && !entry.bankOnly)).filter(Boolean);
  if (!favorites.length) return `<div class="favorite-empty">Favorite pages will show here.</div>`;
  return favorites.map((entry) => `<button class="tab ${entry.id === phase.id ? "active" : ""}" data-phase="${esc(entry.id)}">${esc(entry.name)}</button>`).join("");

function itemCard(phase, item, options = {}) {
  const servings = getServings(phase, item);
  const weeklyCal = item.calories * servings;
  const dailyCal = weeklyCal / 7;
  const isLibrary = options.library;
  const mealUsage = options.bankDelete ? mealUsageForFood(item) : [];
  const sourceText = options.bankDelete
    ? (mealUsage.length ? `Used in ${mealUsage.slice(0, 3).join(", ")}${mealUsage.length > 3 ? ` +${mealUsage.length - 3} more` : ""}` : "Not used in saved meals")
    : (item.sources?.length ? `From ${item.sources.slice(0, 2).join(", ")}` : "From library");
  const libraryAction = options.bankDelete

function renderSummary() {
  const phase = currentPhase();
  if (!phase) return;
  const daily = dailyMealTotals();
  const targets = { ...DEFAULT_TARGETS, ...(phase.targets || {}) };
  const macroCal = macroCalories(daily);
  const fatEnd = macroCal.fatPct;
  const carbEnd = macroCal.fatPct + macroCal.carbsPct;
  const summary = document.querySelector("[data-summary]");
  const bottom = document.querySelector("[data-bottom]");
  const goalCard = (label, actual, target, unit = "") => {
    const fill = target > 0 ? Math.min(actual / target * 100, 120) : 0;
    const remaining = target > 0 ? target - actual : 0;
    const status = target > 0 && remaining > 0 ? "under" : target > 0 && remaining < 0 ? "over" : "";
    const remainingText = target > 0 ? `${remaining >= 0 ? fmt(remaining) + unit + " left" : fmt(Math.abs(remaining)) + unit + " over"}` : "No goal set";
    return `
      <div class="goal-card ${status}">
        <span>${label}</span>
        <strong>${fmt(actual)}${unit} / ${target ? fmt(target) + unit : "--"}</strong>
        <small>${remainingText}</small>
        <div class="bar"><i style="--fill:${fill}%"></i></div>
      </div>
    `;
  };
  if (summary) {
    summary.innerHTML = `
      <div class="metric"><span>Daily Calories</span><strong>${fmt(daily.calories)}</strong></div>
      <div class="metric"><span>Daily Protein</span><strong>${fmt(daily.protein)}g</strong></div>

      <div class="metric"><span>Daily Carbs</span><strong>${fmt(daily.carbs)}g</strong></div>

            <div class="legend-row"><i class="swatch protein"></i><span>Protein</span><b>${fmt(macroCal.proteinPct)}%</b></div>
          </div>
        </div>
        <div class="goal-grid">
          ${goalCard("Calories", daily.calories, targets.calories)}

  }

function isoDate(date) {
  return date.toISOString().slice(0, 10);
}

function ageFromBirthDate(birthDate) {
  if (!birthDate) return 0;
  const birth = new Date(`${birthDate}T00:00:00`);
  if (Number.isNaN(birth.getTime())) return 0;
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const beforeBirthday = now.getMonth() < birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate());
  if (beforeBirthday) age -= 1;
  return Math.max(0, age);
}

function bmrValue(profile) {
  const age = ageFromBirthDate(profile.birthDate);
  const weightLb = parseNumber(profile.currentWeight);
  const feet = parseNumber(profile.heightFeet);
  const inches = parseNumber(profile.heightInches);
  const heightIn = feet * 12 + inches;
  if (!age || !weightLb || !heightIn || !profile.gender) return 0;
  const kg = weightLb / 2.20462;
  const cm = heightIn * 2.54;
  return profile.gender === "female"
    ? (10 * kg) + (6.25 * cm) - (5 * age) - 161
    : (10 * kg) + (6.25 * cm) - (5 * age) + 5;
}

function trainingStreak() {
  let streak = 0;
  const day = new Date();
  for (let i = 0; i < 365; i += 1) {
    const key = isoDate(day);
    const entry = state.trainingLog[key] || {};
    if (entry.gym || entry.cardio) streak += 1;
    else break;
    day.setDate(day.getDate() - 1);
  }
  return streak;
}

function trainingCounts() {
  return Object.values(state.trainingLog).reduce((totals, entry) => {
    if (entry.gym) totals.gym += 1;
    if (entry.cardio) totals.cardio += 1;
    return totals;
  }, { gym: 0, cardio: 0 });
}

function monthKeyFromDate(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}

function monthLabel(monthKey) {
  const [year, month] = monthKey.split("-").map(Number);
  return new Date(year, month - 1, 1).toLocaleString(undefined, { month: "long", year: "numeric" });
}

function monthlyTrainingTotals() {
  const start = new Date(2026, 6, 1);
  const current = new Date();
  const end = new Date(current.getFullYear(), current.getMonth(), 1);
  const totals = new Map();
  const cursor = new Date(start);
  while (cursor <= end) {
    totals.set(monthKeyFromDate(cursor), { gym: 0, cardio: 0 });
    cursor.setMonth(cursor.getMonth() + 1);
  }
  Object.entries(state.trainingLog).forEach(([dateKey, entry]) => {
    const monthKey = dateKey.slice(0, 7);
    if (!totals.has(monthKey)) totals.set(monthKey, { gym: 0, cardio: 0 });
    const total = totals.get(monthKey);
    if (entry.gym) total.gym += 1;
    if (entry.cardio) total.cardio += 1;
  });
  return [...totals.entries()].sort(([a], [b]) => a.localeCompare(b));
}

function renderMonthlyTrainingSummary() {
  const rows = monthlyTrainingTotals().map(([monthKey, totals]) => `
    <div class="month-row">
      <strong>${monthLabel(monthKey)}</strong>
      <span class="month-pill">G ${totals.gym}</span>
      <span class="month-pill cardio">C ${totals.cardio}</span>
    </div>
  `).join("");
  return `
    <div class="month-summary">
      <h3>Monthly Totals</h3>
      ${rows}
    </div>
  `;
}

function renderTrainingCalendar() {
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const first = new Date(year, month, 1);
  const days = new Date(year, month + 1, 0).getDate();
  const blanks = first.getDay();
  const cells = [];
  for (let i = 0; i < blanks; i += 1) cells.push(`<div class="cal-cell muted"></div>`);
  for (let day = 1; day <= days; day += 1) {
    const date = new Date(year, month, day);
    const key = isoDate(date);
    const entry = state.trainingLog[key] || {};
    const active = entry.gym || entry.cardio;
    cells.push(`
      <button type="button" class="cal-cell ${active ? "active" : ""}" data-training-day="${key}">
        <span>${day}</span>
        <small>${entry.gym ? "G" : ""}${entry.cardio ? "C" : ""}</small>
      </button>
    `);
  }
  return `
    <section class="home-hero">
      <h2>${today.toLocaleString(undefined, { month: "long" })} Training</h2>
      <p>Tap a day to mark gym and/or cardio.</p>
      <div class="cal-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="calendar-grid">${cells.join("")}</div>
      ${renderMonthlyTrainingSummary()}
    </section>
  `;
}

      <button class="ghost" data-view-target="archive">Open Phase Archive</button>
    </section>
    <div data-modal-root></div>
  `;
  renderModal();
}

        <div>
          <div class="item-name">${esc(item.name)}</div>

        ${options.add ? `<button class="mini add" data-cheat-add="${esc(item.id)}" data-cheat-source="${esc(options.source)}">Add</button>` : ""}
      </div>
      <div class="macro-grid">
        <div class="macro"><span>Cal</span><b>${fmt(item.calories)}</b></div>
        <div class="macro"><span>Fat</span><b>${fmt(item.fat)}g</b></div>

function cheatTotals() {
  return MEAL_SLOTS.flatMap((slot) => state.cheatEntries[slot] || []).reduce((totals, item) => {
    const servings = parseNumber(item.servings || 1);
    totals.calories += item.calories * servings;
    totals.fat += item.fat * servings;
    totals.carbs += item.carbs * servings;
    totals.protein += item.protein * servings;
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0 });
}

function mealOptions(selected = "") {
  return `<option value="">Choose saved meal...</option>${savedMeals().map((meal) => {
    const id = meal.id || meal.name;
    return `<option value="${esc(id)}" ${id === selected ? "selected" : ""}>${esc(meal.name)}</option>`;

function renderMealPlanSummary() {
  const totals = dailyMealTotals();
  const targets = { ...DEFAULT_TARGETS, ...(currentPhase()?.targets || {}) };
  const macroCal = macroCalories(totals);
  const fatEnd = macroCal.fatPct;
  const carbEnd = macroCal.fatPct + macroCal.carbsPct;
  const goalCard = (label, actual, target, unit = "") => {
    const fill = target > 0 ? Math.min(actual / target * 100, 120) : 0;
    const remaining = target > 0 ? target - actual : 0;
    const status = target > 0 && remaining > 0 ? "under" : target > 0 && remaining < 0 ? "over" : "";
    const remainingText = target > 0 ? `${remaining >= 0 ? fmt(remaining) + unit + " left" : fmt(Math.abs(remaining)) + unit + " over"}` : "No goal set";
    return `
      <div class="goal-card ${status}">
        <span>${label}</span>
        <strong>${fmt(actual)}${unit} / ${target ? fmt(target) + unit : "--"}</strong>
        <small>${remainingText}</small>
        <div class="bar"><i style="--fill:${fill}%"></i></div>
      </div>
    `;
  };
  return `
    <section class="summary">
      <div class="metric"><span>Daily Calories</span><strong>${fmt(totals.calories)}</strong></div>
      <div class="metric"><span>Daily Protein</span><strong>${fmt(totals.protein)}g</strong></div>
      <div class="metric"><span>Daily Carbs</span><strong>${fmt(totals.carbs)}g</strong></div>
      <div class="metric"><span>Daily Fat</span><strong>${fmt(totals.fat)}g</strong></div>
      <div class="macro-chart">
        <div class="donut" style="--fat-end:${fatEnd}%; --carb-end:${carbEnd}%"></div>
        <div class="chart-copy">
          <strong>Macro Calories</strong>
          <span>Fat, carbs, and protein calorie split</span>
          <div class="goal-actions"><button class="mini" data-edit-goals>Edit Goals</button></div>
          <div class="legend">
            <div class="legend-row"><i class="swatch fat"></i><span>Fat</span><b>${fmt(macroCal.fatPct)}%</b></div>
            <div class="legend-row"><i class="swatch carbs"></i><span>Carbs</span><b>${fmt(macroCal.carbsPct)}%</b></div>
            <div class="legend-row"><i class="swatch protein"></i><span>Protein</span><b>${fmt(macroCal.proteinPct)}%</b></div>
          </div>
        </div>
        <div class="goal-grid">
          ${goalCard("Calories", totals.calories, targets.calories)}
          ${goalCard("Fat", totals.fat, targets.fat, "g")}
          ${goalCard("Carbs", totals.carbs, targets.carbs, "g")}
          ${goalCard("Protein", totals.protein, targets.protein, "g")}
        </div>
      </div>
    </section>
  `;
}

function renderMealSlot(slot) {
  const instances = mealInstancesForSlot(slot);
  const isCollapsed = !!state.collapsedMealSlots[slot];
  const totals = slotTotals(slot);
  return `
    <section class="slot-card meal-slot-card">
      <div class="meal-header">
        <div>
          <button class="meal-toggle" data-toggle-meal-slot="${esc(slot)}" aria-expanded="${isCollapsed ? "false" : "true"}">
            <span class="triangle">${isCollapsed ? "&#9656;" : "&#9662;"}</span>
            <span class="meal-section-title">${esc(slot)}</span>
          </button>
          <p>${instances.length ? `${instances.length} meal${instances.length === 1 ? "" : "s"} selected` : "No meals selected."}</p>
          ${isCollapsed && instances.length ? `<p>${fmt(totals.calories)} cal - F ${fmt(totals.fat)}g - C ${fmt(totals.carbs)}g - P ${fmt(totals.protein)}g</p>` : ""}
        </div>
      </div>
      ${isCollapsed ? "" : `
      <div class="slot-add-row">
        <select class="phase-select" data-pending-slot-meal="${esc(slot)}">${mealOptions()}</select>
        <button class="primary" data-add-slot-meal="${esc(slot)}">Add Meal</button>
      </div>
      ${instances.length ? instances.map((instance) => {
        const meal = mealById(instance.mealId);
        if (!meal) return "";
        const matches = mealMatchesFor(instance.id, meal);
        const totals = mealMacroTotals(matches);
        return `
          <div class="meal-items">
            <div class="meal-row">
              <div class="meal-row-name">
                <div class="meal-title-line"><strong>${esc(meal.name)}</strong><b>${fmt(totals.calories)} cal</b></div>
                <span>F ${fmt(totals.fat)}g - C ${fmt(totals.carbs)}g - P ${fmt(totals.protein)}g</span>
              </div>
              <button class="mini danger" data-remove-slot-meal="${esc(slot)}" data-meal-instance="${esc(instance.id)}">Remove</button>
            </div>
            ${matches.map((match) => mealItemRow(match)).join("")}
          </div>
        `;
      }).join("") : `<div class="empty">Add one or more saved meals here.</div>`}
      `}
    </section>
  `;
}

function renderMealPlan() {
  ensureMealTemplateFoods();
  document.querySelector("#app").innerHTML = `
    ${topShell("Meal Plan", `<button class="ghost" data-view-target="home">Home</button>`)}
    ${renderMealPlanSummary()}
    <main class="items">
      ${MEAL_PLAN_SLOTS.map(renderMealSlot).join("")}

}

function renderArchiveSummary() {
  const phase = currentPhase();

  const daily = {
    calories: weekly.calories / 7,
    fat: weekly.fat / 7,
    carbs: weekly.carbs / 7,

  };
  const summary = document.querySelector("[data-summary]");
  const bottom = document.querySelector("[data-bottom]");
  if (summary) {
    summary.innerHTML = `
      <div class="metric"><span>Daily Calories</span><strong>${fmt(daily.calories)}</strong></div>
      <div class="metric"><span>Daily Protein</span><strong>${fmt(daily.protein)}g</strong></div>
      <div class="metric"><span>Weekly Calories</span><strong>${fmt(weekly.calories)}</strong></div>

      <div class="bottom-cell"><span>Fat</span><strong>${fmt(daily.fat)}g</strong></div>
      <div class="bottom-cell"><span>Carbs</span><strong>${fmt(daily.carbs)}g</strong></div>

function renderArchiveItems() {
  const phase = currentPhase();
  if (!phase) return;
  const query = state.query.trim().toLowerCase();
  const currentMatches = phase.items.filter((item) => (!state.activeOnly || getServings(phase, item) > 0) && (!query || item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query)));
  const list = document.querySelector("[data-items]");
  if (!list) return;
  list.innerHTML = currentMatches.length ? groupedListHtml(phase, currentMatches) : `<div class="empty">No foods in this archived tab match this search.</div>`;
}

function renderArchive() {
  const phase = currentPhase();
  if (!phase) return;
  const isFavorite = state.favoriteIds.includes(phase.id);
  localStorage.setItem("macroPhase", phase.id);
  document.querySelector("#app").innerHTML = `
    <div class="topbar">
      <div class="title-row">
        <h1>Macro Phases</h1>
        <select class="theme-select" data-theme-select aria-label="Color theme">${themeOptions()}</select>
      </div>
      <select class="phase-select" data-select>${phaseOptions(phase)}</select>
      <div class="top-actions">
        <button class="ghost favorite-toggle ${isFavorite ? "active" : ""}" data-toggle-favorite>${isFavorite ? "Favorited" : "Favorite Page"}</button>

    <section class="summary" data-summary></section>

      <button class="primary" data-open-add-food>Add Food</button>
      <button class="ghost" data-open-add-tab>Add Tab</button>
      <button class="ghost" data-copy-phase>Copy Tab</button>

function render() {
  const phase = currentPhase();
  if (!phase) return;
  applyTheme();
  saveFavorites();
  if (state.view === "home") {
    renderHome();
    return;
  }
  if (state.view === "meal" || state.view === "phase") {
    renderMealPlan();
    return;
  }
  if (state.view === "archive") {
    renderArchive();
    return;
  }
  if (state.view === "bank") {
    renderFoodBank();
    return;
  }
  if (state.view === "cheat") {
    renderCheat();
    return;
  }
  if (state.view === "desserts") {
    renderDesserts();
    return;
  }
  renderHome();
}

document.addEventListener("click", (event) => {
  if (event.target.closest("[data-close-modal]") && !event.target.closest(".modal")) {
    state.modal = null;
    renderModal();
    return;
  }
  if (event.target.closest("[data-cancel]")) {
    state.modal = null;
    renderModal();
    return;
  }
  const trainingDay = event.target.closest("[data-training-day]");
  if (trainingDay) {
    const key = trainingDay.dataset.trainingDay;
    const current = state.trainingLog[key] || {};
    if (!current.gym && !current.cardio) {
      state.trainingLog[key] = { gym: true, cardio: false };
    } else if (current.gym && !current.cardio) {
      state.trainingLog[key] = { gym: false, cardio: true };
    } else if (!current.gym && current.cardio) {
      state.trainingLog[key] = { gym: true, cardio: true };
    } else {
      delete state.trainingLog[key];
    }
    localStorage.setItem(TRAINING_KEY, JSON.stringify(state.trainingLog));
    render();
    return;
  }
  const viewButton = event.target.closest("[data-view-target]");
  if (viewButton) {
    setView(viewButton.dataset.viewTarget);
    state.query = "";
    render();
    return;
  }
  if (event.target.closest("[data-edit-profile]")) {
    state.editingProfile = true;
    render();
    return;
  }
  if (event.target.closest("[data-open-bank]")) {
    setView("bank");
    state.query = "";
    render();
    return;
  }
  if (event.target.closest("[data-back-phase]")) {
    setView("home");
    state.query = "";
    render();
    return;
  }
  if (event.target.closest("[data-copy-phase]")) {
    copyCurrentPhase();
    return;
  }
  if (event.target.closest("[data-toggle-active]")) {
    state.activeOnly = !state.activeOnly;
    localStorage.setItem("macroActiveOnly", String(state.activeOnly));
    render();
    return;
  }
  if (event.target.closest("[data-edit-goals]")) {
    state.modal = { type: "goals" };
    renderModal();
    return;
  }
  const mealSlotToggle = event.target.closest("[data-toggle-meal-slot]");
  if (mealSlotToggle) {
    const slot = mealSlotToggle.dataset.toggleMealSlot;
    state.collapsedMealSlots[slot] = !state.collapsedMealSlots[slot];
    if (!state.collapsedMealSlots[slot]) delete state.collapsedMealSlots[slot];
    localStorage.setItem(MEAL_COLLAPSE_KEY, JSON.stringify(state.collapsedMealSlots));
    renderMealPlan();
    return;
  }
  const addSlotMeal = event.target.closest("[data-add-slot-meal]");
  if (addSlotMeal) {
    const slot = addSlotMeal.dataset.addSlotMeal;
    const select = document.querySelector(`[data-pending-slot-meal="${CSS.escape(slot)}"]`);
    const mealId = select?.value || "";
    if (!mealId) return;
    state.mealSlots[slot] = mealInstancesForSlot(slot);
    state.mealSlots[slot].push({ id: `${slug(slot)}-${slug(mealId)}-${Date.now()}`, mealId });
    localStorage.setItem(MEAL_SLOT_KEY, JSON.stringify(state.mealSlots));
    renderMealPlan();
    return;
  }
  const removeSlotMeal = event.target.closest("[data-remove-slot-meal]");
  if (removeSlotMeal) {
    const slot = removeSlotMeal.dataset.removeSlotMeal;
    const instanceId = removeSlotMeal.dataset.mealInstance;
    state.mealSlots[slot] = mealInstancesForSlot(slot).filter((instance) => instance.id !== instanceId);
    Object.keys(state.mealServings).forEach((key) => {
      if (key.startsWith(`${instanceId}::`)) delete state.mealServings[key];
    });
    localStorage.setItem(MEAL_SLOT_KEY, JSON.stringify(state.mealSlots));
    localStorage.setItem(MEAL_PLAN_KEY, JSON.stringify(state.mealServings));
    renderMealPlan();
    return;
  }
  const phaseButton = event.target.closest("[data-phase]");
  if (phaseButton) {
    state.phaseId = phaseButton.dataset.phase;
    render();
    return;
  }
  if (event.target.closest("[data-toggle-favorite]")) {
    const phase = currentPhase();
    if (state.favoriteIds.includes(phase.id)) {
      state.favoriteIds = state.favoriteIds.filter((id) => id !== phase.id);
    } else {
      state.favoriteIds.push(phase.id);
    }
    saveFavorites();
    render();
    return;
  }
  const stepButton = event.target.closest("[data-step]");
  if (stepButton) {
    const phase = currentPhase();
    const item = phase.items.find((entry) => entry.id === stepButton.dataset.itemId);
    setServings(phase, item, getServings(phase, item) + Number(stepButton.dataset.step));
    return;
  }
  const mealStepButton = event.target.closest("[data-meal-step]");
  if (mealStepButton) {
    const key = mealStepButton.dataset.mealKey;
    const current = state.mealServings[key] ?? parseNumber(document.querySelector(`[data-meal-input="${CSS.escape(key)}"]`)?.value);
    setMealServing(key, current + Number(mealStepButton.dataset.mealStep));
    return;
  }
  const editButton = event.target.closest("[data-edit-item]");
  if (editButton) {
    state.modal = { type: "food", itemId: editButton.dataset.editItem };
    renderModal();
    return;
  }
  const deleteButton = event.target.closest("[data-delete-item]");
  if (deleteButton) {
    const phase = currentPhase();
    const item = phase.items.find((entry) => entry.id === deleteButton.dataset.deleteItem);
    if (item && confirm(`Delete ${item.name} from this tab?`)) {
      phase.items = phase.items.filter((entry) => entry.id !== item.id);
      saveData();
      render();
    }
    return;
  }
  const addLibraryButton = event.target.closest("[data-add-library]");
  if (addLibraryButton) {
    const phase = currentPhase();
    const item = foodLibrary().find((entry) => entry.id === addLibraryButton.dataset.addLibrary);
    if (item) {
      const servings = prompt(`Weekly servings for ${item.name}:`, "0");
      if (servings === null) return;
      phase.items.push({ ...item, id: `${slug(item.name)}-${Date.now()}`, servings: parseNumber(servings), sources: undefined });
      saveData();
      setView("phase");
      render();
    }
    return;
  }
  const editBankFood = event.target.closest("[data-edit-bank-food]");
  if (editBankFood) {
    state.modal = { type: "food", bankItem: true, bankEditKey: editBankFood.dataset.editBankFood };
    renderModal();
    return;
  }
  const deleteBankFood = event.target.closest("[data-delete-bank-food]");
  if (deleteBankFood) {
    const itemKey = deleteBankFood.dataset.deleteBankFood;
    const item = foodLibrary().find((entry) => foodKey(entry) === itemKey);
    if (item) {
      deleteFoodFromBank(itemKey);
      if (state.view === "bank") renderFoodBank();
      else render();
    }
    return;
  }
  const cheatAdd = event.target.closest("[data-cheat-add]");
  if (cheatAdd) {
    const source = cheatAdd.dataset.cheatSource;
    const item = source === "restaurant"
      ? RESTAURANT_MEALS.find((entry) => entry.id === cheatAdd.dataset.cheatAdd)
      : foodLibrary().find((entry) => entry.id === cheatAdd.dataset.cheatAdd);
    if (!item) return;
    state.modal = { type: "cheat", cheatItem: { ...item, servings: 1, restaurant: item.restaurant || "Food Bank", slot: item.slot || "Other" } };
    renderModal();
    return;
  }
  if (event.target.closest("[data-open-manual-cheat]")) {
    state.modal = { type: "cheat", cheatItem: { name: "", restaurant: "Manual", slot: "Other", servings: 1, calories: 0, fat: 0, carbs: 0, protein: 0 } };
    renderModal();
    return;
  }
  if (event.target.closest("[data-open-bank-food]")) {
    state.modal = { type: "food", bankItem: true };
    renderModal();
    return;
  }
  if (event.target.closest("[data-open-create-meal]")) {
    state.modal = { type: "meal" };
    renderModal();
    return;
  }
  const deleteCustomMeal = event.target.closest("[data-delete-custom-meal]");
  if (deleteCustomMeal) {
    const mealId = deleteCustomMeal.dataset.deleteCustomMeal;
    const meal = state.customMeals.find((entry) => entry.id === mealId);
    if (meal && confirm(`Delete saved meal ${meal.name}?`)) {
      state.customMeals = state.customMeals.filter((entry) => entry.id !== mealId);
      Object.keys(state.mealSlots).forEach((slot) => {
        state.mealSlots[slot] = mealInstancesForSlot(slot).filter((instance) => instance.mealId !== mealId);
      });
      saveCustomMeals();
      localStorage.setItem(MEAL_SLOT_KEY, JSON.stringify(state.mealSlots));
      render();
    }
    return;
  }
  if (event.target.closest("[data-clear-cheat]")) {
    if (confirm("Clear all cheat day entries?")) {
      state.cheatEntries = {};
      localStorage.removeItem(CHEAT_KEY);
      render();
    }
    return;
  }
  const cheatRemove = event.target.closest("[data-cheat-remove]");
  if (cheatRemove) {
    const slot = cheatRemove.dataset.cheatRemove;
    const index = Number(cheatRemove.dataset.cheatIndex);
    state.cheatEntries[slot] = (state.cheatEntries[slot] || []).filter((_, itemIndex) => itemIndex !== index);
    localStorage.setItem(CHEAT_KEY, JSON.stringify(state.cheatEntries));
    render();
    return;
  }
  if (event.target.closest("[data-open-add-food]")) {
    state.modal = { type: "food" };
    renderModal();
    return;
  }
  if (event.target.closest("[data-open-add-tab]")) {
    state.modal = { type: "tab" };
    renderModal();
    return;
  }
  if (event.target.closest("[data-clear]")) {
    state.query = "";
    render();
    return;
  }
  if (event.target.closest("[data-reset]")) {
    if (confirm("Reset all edits and serving changes back to the original spreadsheet?")) {
      DATA = prepareData(clone(ORIGINAL_DATA));
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem("macroServings");
      localStorage.removeItem("macroActiveOnly");
      localStorage.removeItem(CHEAT_KEY);
      localStorage.removeItem(MEAL_PLAN_KEY);
      localStorage.removeItem(MEAL_SLOT_KEY);
      localStorage.removeItem(CUSTOM_MEALS_KEY);
      localStorage.removeItem(DELETED_FOOD_KEY);
      localStorage.removeItem(MEAL_FOOD_KEY);
      state.favoriteIds = [];
      state.cheatEntries = {};
      state.mealServings = {};
      state.mealSlots = {};
      state.customMeals = [];
      state.deletedFoodKeys = [];
      state.mealFoodKeys = {};
      localStorage.removeItem(FAVORITES_KEY);
      state.phaseId = DATA[0]?.id;
      state.activeOnly = false;
      setView("home");
      render();
    }
  }
});

document.addEventListener("input", (event) => {
  if (event.target.matches("[data-search]")) {
    state.query = event.target.value;
    if (state.view === "bank") renderFoodBankItems();
    else if (state.view === "cheat") renderCheat();
    else if (state.view === "meal" || state.view === "phase") renderMealPlan();
    else if (state.view === "archive") renderArchiveItems();
    else renderItems();
  }
});

document.addEventListener("change", (event) => {
  if (event.target.matches("[data-theme-select]")) {
    state.theme = event.target.value;
    applyTheme();
    if (state.view === "archive") renderArchiveSummary();
    if (state.view === "meal" || state.view === "phase") renderMealPlan();
    return;
  }
  if (event.target.matches("[data-slot-meal]")) {
    const slot = event.target.dataset.slotMeal;
    const meal = event.target.value;
    if (meal) state.mealSlots[slot] = meal;
    else delete state.mealSlots[slot];
    localStorage.setItem(MEAL_SLOT_KEY, JSON.stringify(state.mealSlots));
    renderMealPlan();
    return;
  }
  if (event.target.matches("[data-select]")) {
    state.phaseId = event.target.value;
    render();
    return;
  }
  if (event.target.matches("[data-input-id]")) {
    const phase = currentPhase();
    const item = phase.items.find((entry) => entry.id === event.target.dataset.inputId);
    setServings(phase, item, event.target.value);
    return;
  }
  if (event.target.matches("[data-meal-input]")) {
    setMealServing(event.target.dataset.mealInput, event.target.value);
  }
});

document.addEventListener("submit", (event) => {
  const profileForm = event.target.closest("[data-profile-form]");
  if (profileForm) {
    event.preventDefault();
    const formData = new FormData(profileForm);
    const submittedName = String(formData.get("profileName") || "").trim();
    if (submittedName) state.profileName = submittedName;
    state.profileData = {
      birthDate: String(formData.get("birthDate") || ""),
      gender: String(formData.get("gender") || ""),
      heightFeet: String(formData.get("heightFeet") || ""),
      heightInches: String(formData.get("heightInches") || ""),
      currentWeight: String(formData.get("currentWeight") || ""),
      goalWeight: String(formData.get("goalWeight") || ""),
      goal: String(formData.get("goal") || "")
    };
    localStorage.setItem(PROFILE_KEY, state.profileName);
    localStorage.setItem(PROFILE_DATA_KEY, JSON.stringify(state.profileData));
    state.editingProfile = false;
    render();
    return;
  }
  const form = event.target.closest("[data-food-form]");
  if (!form) return;
  event.preventDefault();
  const phase = form.dataset.formBank === "true" ? foodBankPhase() : currentPhase();
  const formData = new FormData(form);
  if (form.dataset.formType === "training") {
    const date = String(formData.get("trainingDate") || "");
    const type = String(formData.get("trainingType") || "");
    if (date) {
      if (!type) delete state.trainingLog[date];
      else state.trainingLog[date] = {
        gym: type === "gym" || type === "both",
        cardio: type === "cardio" || type === "both"
      };
      localStorage.setItem(TRAINING_KEY, JSON.stringify(state.trainingLog));
    }
  } else if (form.dataset.formType === "tab") {
    const name = String(formData.get("tabName") || "").trim();
    if (!name) return;
    const id = `${slug(name)}-${Date.now()}`;
    DATA.push({ id, name, targets: { ...DEFAULT_TARGETS }, items: [] });
    state.phaseId = id;
  } else if (form.dataset.formType === "goals") {
    phase.targets = {
      calories: parseNumber(formData.get("goalCalories")),
      fat: parseNumber(formData.get("goalFat")),
      carbs: parseNumber(formData.get("goalCarbs")),
      protein: parseNumber(formData.get("goalProtein"))
    };
  } else if (form.dataset.formType === "cheat") {
    const slot = String(formData.get("cheatSlot") || "Other");
    const servings = Math.max(0, parseNumber(formData.get("cheatServings")) || 1);
    const itemData = {
      id: `${slug(formData.get("cheatName"))}-${Date.now()}`,
      name: String(formData.get("cheatName") || "").trim() || "Cheat meal",
      restaurant: String(formData.get("cheatRestaurant") || "").trim() || "Manual",
      servings,
      calories: parseNumber(formData.get("cheatCalories")),
      fat: parseNumber(formData.get("cheatFat")),
      carbs: parseNumber(formData.get("cheatCarbs")),
      protein: parseNumber(formData.get("cheatProtein"))
    };
    state.cheatEntries[slot] = state.cheatEntries[slot] || [];
    state.cheatEntries[slot].push(itemData);
    localStorage.setItem(CHEAT_KEY, JSON.stringify(state.cheatEntries));
  } else if (form.dataset.formType === "meal") {
    const name = String(formData.get("mealName") || "").trim();
    if (!name) return;
    const items = [];
    for (let index = 0; index < 8; index += 1) {
      const itemName = String(formData.get(`mealItem${index}`) || "").trim();
      const servings = parseNumber(formData.get(`mealServing${index}`));
      if (!itemName || servings <= 0) continue;
      items.push({ name: itemName, servings, aliases: [itemName] });
    }
    if (!items.length) return;
    state.customMeals.push({ id: `${slug(name)}-${Date.now()}`, name, custom: true, items });
    saveCustomMeals();
  } else {
    const itemData = {
      id: form.dataset.formItem || `${slug(formData.get("name"))}-${Date.now()}`,
      name: String(formData.get("name") || "").trim() || "New food",
      category: String(formData.get("category") || "").trim(),
      servings: parseNumber(formData.get("servings")),
      calories: parseNumber(formData.get("calories")),
      fat: parseNumber(formData.get("fat")),
      carbs: parseNumber(formData.get("carbs")),
      protein: parseNumber(formData.get("protein"))
    };
    if (form.dataset.formBankKey) {
      editFoodInBank(form.dataset.formBankKey, itemData);
    } else {
      const existingIndex = phase.items.findIndex((item) => item.id === itemData.id);
      if (existingIndex >= 0) phase.items[existingIndex] = itemData;
      else phase.items.push(itemData);
    }
    state.deletedFoodKeys = (state.deletedFoodKeys || []).filter((key) => key !== foodKey(itemData));
    localStorage.setItem(DELETED_FOOD_KEY, JSON.stringify(state.deletedFoodKeys));
  }
  saveData();
  state.modal = null;
  render();
});

applyTheme();
render();
</script>
</body>
</html>
