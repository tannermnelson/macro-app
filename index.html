<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Macro Phases</title>
  <style>
:root {
  color-scheme: light;
  --ink: #17211b;
  --muted: #667269;
  --line: #dfe6df;
  --paper: #fbfcf8;
  --panel: #ffffff;
  --accent: #16735f;
  --accent-dark: #0f5143;
  --gold: #c89021;
  --blue: #386fa4;
  --danger: #a63d40;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
}
button, input, select { font: inherit; }
.app {
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 112px;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: -16px -16px 12px;
  padding: 14px 16px 12px;
  background: color-mix(in srgb, var(--paper) 92%, white);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
}
h1 {
  margin: 0;
  font-size: 1.2rem;
  letter-spacing: 0;
}
.phase-select {
  width: 100%;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  padding: 12px;
}
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 0 2px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  border-radius: 999px;
  padding: 9px 12px;
  white-space: nowrap;
}
.tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 12px 0;
}
.metric {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.metric span {
  display: block;
  color: var(--muted);
  font-size: .76rem;
}
.metric strong {
  display: block;
  margin-top: 4px;
  font-size: 1.25rem;
}
.toolbar {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin: 12px 0;
}
.search {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  background: var(--panel);
}
.ghost {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 12px;
  background: var(--panel);
  color: var(--accent-dark);
}
.items {
  display: grid;
  gap: 10px;
}
.item {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.item-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: start;
}
.item-name {
  font-weight: 750;
  line-height: 1.2;
}
.item-cat {
  margin-top: 3px;
  color: var(--muted);
  font-size: .78rem;
}
.macro-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  margin-top: 12px;
}
.macro {
  background: #f4f7f1;
  border-radius: 6px;
  padding: 7px 6px;
  text-align: center;
}
.macro span {
  display: block;
  font-size: .68rem;
  color: var(--muted);
}
.macro b {
  display: block;
  margin-top: 2px;
  font-size: .86rem;
}
.servings {
  display: grid;
  grid-template-columns: 36px 58px 36px;
  gap: 4px;
  align-items: center;
}
.servings button {
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: #f7faf5;
  color: var(--accent-dark);
  font-size: 1.2rem;
  line-height: 1;
}
.servings input {
  width: 58px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: center;
  background: white;
}
.subtotals {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  color: var(--muted);
  font-size: .78rem;
}
.bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  background: #10231d;
  color: white;
  border-top: 1px solid rgba(255,255,255,.15);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}
.bottom-grid {
  max-width: 760px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.bottom-cell {
  text-align: center;
}
.bottom-cell span {
  display: block;
  font-size: .66rem;
  color: rgba(255,255,255,.68);
}
.bottom-cell strong {
  display: block;
  margin-top: 2px;
  font-size: 1rem;
}
.empty {
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 24px;
  text-align: center;
  color: var(--muted);
}
@media (min-width: 720px) {
  .app {
    max-width: 760px;
    margin: 0 auto;
    padding-inline: 20px;
  }
  .topbar { margin-inline: -20px; padding-inline: 20px; }
  .summary { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>

const state = {
  phaseId: localStorage.getItem("macroPhase") || DATA[0]?.id,
  query: "",
  overrides: JSON.parse(localStorage.getItem("macroServings") || "{}")
};

const fmt = (n) => {
  const value = Number(n || 0);
  return Number.isInteger(value) ? String(value) : value.toFixed(1).replace(/\.0$/, "");
};
const keyFor = (phase, item) => `${phase.id}::${item.name}`;
const getServings = (phase, item) => {
  const key = keyFor(phase, item);
  return state.overrides[key] ?? item.servings ?? 0;
};
const setServings = (phase, item, value) => {
  const key = keyFor(phase, item);
  const parsed = Math.max(0, Math.round(Number(value || 0) * 2) / 2);
  state.overrides[key] = parsed;
  localStorage.setItem("macroServings", JSON.stringify(state.overrides));
  render();
};
const currentPhase = () => DATA.find((phase) => phase.id === state.phaseId) || DATA[0];
const totalsFor = (phase, items = phase.items) => items.reduce((totals, item) => {
  const servings = getServings(phase, item);
  totals.calories += item.calories * servings;
  totals.fat += item.fat * servings;
  totals.carbs += item.carbs * servings;
  totals.protein += item.protein * servings;
  totals.servings += servings;
  return totals;
}, { calories: 0, fat: 0, carbs: 0, protein: 0, servings: 0 });

function phaseOptions(phase) {
  return DATA.map((entry) => `<option value="${entry.id}" ${entry.id === phase.id ? "selected" : ""}>${entry.name}</option>`).join("");
}

function tabs(phase) {
  return DATA.map((entry) => `<button class="tab ${entry.id === phase.id ? "active" : ""}" data-phase="${entry.id}">${entry.name}</button>`).join("");
}

function itemCard(phase, item) {
  const servings = getServings(phase, item);
  const weeklyCal = item.calories * servings;
  const dailyCal = weeklyCal / 7;
  return `
    <article class="item">
      <div class="item-head">
        <div>
          <div class="item-name">${item.name}</div>
          <div class="item-cat">${item.category || "Per serving"} · ${fmt(item.calories)} cal</div>
        </div>
        <div class="servings" aria-label="Weekly servings for ${item.name}">
          <button data-step="-0.5" data-item="${item.name}" aria-label="Remove serving">-</button>
          <input inputmode="decimal" value="${fmt(servings)}" data-input="${item.name}" aria-label="Weekly servings">
          <button data-step="0.5" data-item="${item.name}" aria-label="Add serving">+</button>
        </div>
      </div>
      <div class="macro-grid">
        <div class="macro"><span>Cal</span><b>${fmt(item.calories)}</b></div>
        <div class="macro"><span>Fat</span><b>${fmt(item.fat)}g</b></div>
        <div class="macro"><span>Carbs</span><b>${fmt(item.carbs)}g</b></div>
        <div class="macro"><span>Protein</span><b>${fmt(item.protein)}g</b></div>
      </div>
      <div class="subtotals">
        <span>${fmt(weeklyCal)} weekly cal</span>
        <span>${fmt(dailyCal)} daily cal avg</span>
      </div>
    </article>
  `;
}

function render() {
  const phase = currentPhase();
  if (!phase) return;
  localStorage.setItem("macroPhase", phase.id);
  const query = state.query.trim().toLowerCase();
  const filtered = phase.items.filter((item) => !query || item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query));
  const weekly = totalsFor(phase);
  const daily = {
    calories: weekly.calories / 7,
    fat: weekly.fat / 7,
    carbs: weekly.carbs / 7,
    protein: weekly.protein / 7
  };
  document.querySelector("#app").innerHTML = `
    <div class="topbar">
      <div class="title-row">
        <h1>Macro Phases</h1>
        <button class="ghost" data-reset>Reset</button>
      </div>
      <select class="phase-select" data-select>${phaseOptions(phase)}</select>
      <div class="tabs">${tabs(phase)}</div>
    </div>
    <section class="summary">
      <div class="metric"><span>Daily Calories</span><strong>${fmt(daily.calories)}</strong></div>
      <div class="metric"><span>Daily Protein</span><strong>${fmt(daily.protein)}g</strong></div>
      <div class="metric"><span>Weekly Calories</span><strong>${fmt(weekly.calories)}</strong></div>
      <div class="metric"><span>Weekly Servings</span><strong>${fmt(weekly.servings)}</strong></div>
    </section>
    <div class="toolbar">
      <input class="search" type="search" placeholder="Search foods" value="${state.query}" data-search>
      <button class="ghost" data-clear>Clear</button>
    </div>
    <main class="items">
      ${filtered.length ? filtered.map((item) => itemCard(phase, item)).join("") : `<div class="empty">No foods match this search.</div>`}
    </main>
    <footer class="bottom">
      <div class="bottom-grid">
        <div class="bottom-cell"><span>Cal</span><strong>${fmt(daily.calories)}</strong></div>
        <div class="bottom-cell"><span>Fat</span><strong>${fmt(daily.fat)}g</strong></div>
        <div class="bottom-cell"><span>Carbs</span><strong>${fmt(daily.carbs)}g</strong></div>
        <div class="bottom-cell"><span>Protein</span><strong>${fmt(daily.protein)}g</strong></div>
      </div>
    </footer>
  `;
}

document.addEventListener("click", (event) => {
  const phaseButton = event.target.closest("[data-phase]");
  if (phaseButton) {
    state.phaseId = phaseButton.dataset.phase;
    render();
    return;
  }
  const stepButton = event.target.closest("[data-step]");
  if (stepButton) {
    const phase = currentPhase();
    const item = phase.items.find((entry) => entry.name === stepButton.dataset.item);
    setServings(phase, item, getServings(phase, item) + Number(stepButton.dataset.step));
    return;
  }
  if (event.target.closest("[data-clear]")) {
    state.query = "";
    render();
    return;
  }
  if (event.target.closest("[data-reset]")) {
    if (confirm("Reset serving changes for all phases?")) {
      state.overrides = {};
      localStorage.removeItem("macroServings");
      render();
    }
  }
});

document.addEventListener("input", (event) => {
  if (event.target.matches("[data-search]")) {
    state.query = event.target.value;
    render();
  }
});

document.addEventListener("change", (event) => {
  if (event.target.matches("[data-select]")) {
    state.phaseId = event.target.value;
    render();
    return;
  }
  if (event.target.matches("[data-input]")) {
    const phase = currentPhase();
    const item = phase.items.find((entry) => entry.name === event.target.dataset.input);
    setServings(phase, item, event.target.value);
  }
});

render();
</script>
