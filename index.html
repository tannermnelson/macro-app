  <title>Macro Phases</title>
  <style>
:root {
  color-scheme: light;
  --ink: #17211b;
  --muted: #667269;
  --line: #dfe6df;
  --paper: #fbfcf8;
  --panel: #ffffff;
  --accent: #16735f;
  --accent-dark: #0f5143;
  --gold: #c89021;
  --blue: #386fa4;
  --danger: #a63d40;
  --under-goal: #b9413f;
  --soft: #e9f5ee;
  --soft-2: #d6eadf;
  --bottom: #10231d;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
[data-theme="ocean"] {
  --ink: #142126;
  --muted: #61737a;
  --line: #a9d4dd;
  --paper: #e8f8fb;
  --panel: #f8feff;
  --accent: #0085a8;
  --accent-dark: #004f66;
  --gold: #d99c22;
  --blue: #245dd8;
  --danger: #a63d40;
  --under-goal: #b33f32;
  --soft: #d8f0f5;
  --soft-2: #bfe5ed;
  --bottom: #063342;
}
[data-theme="forest"] {
  --ink: #17211b;
  --muted: #667269;
  --line: #bdd7c6;
  --paper: #edf8ef;
  --panel: #fbfffb;
  --accent: #0f805f;
  --accent-dark: #084d39;
  --gold: #c99118;
  --blue: #2c689b;
  --danger: #a63d40;
  --under-goal: #b9413f;
  --soft: #dcefe2;
  --soft-2: #c4e3cf;
  --bottom: #0b2d20;
}
[data-theme="sunrise"] {
  --ink: #2a211d;
  --muted: #77675e;
  --line: #efc5af;
  --paper: #fff1e8;
  --panel: #fffaf6;
  --accent: #d84f22;
  --accent-dark: #873015;
  --gold: #e09a16;
  --blue: #267aa0;
  --danger: #a33b42;
  --under-goal: #087f6f;
  --soft: #ffe0d0;
  --soft-2: #f8c9af;
  --bottom: #4d2215;
}
[data-theme="berry"] {
  --ink: #241b2c;
  --muted: #71657a;
  --line: #d8badd;
  --paper: #fbecff;
  --panel: #fff8ff;
  --accent: #a73583;
  --accent-dark: #672052;
  --gold: #d08d18;
  --blue: #4368c4;
  --danger: #a63d40;
  --under-goal: #15806f;
  --soft: #f1d7f4;
  --soft-2: #e5c1eb;
  --bottom: #311738;
}
[data-theme="graphite"] {
  --ink: #1d2227;
  --muted: #68717a;
  --line: #c3cbd2;
  --paper: #edf1f4;
  --panel: #fbfcfd;
  --accent: #3f5f7a;
  --accent-dark: #24394b;
  --gold: #c48d1f;
  --blue: #167ca5;
  --danger: #a64045;
  --under-goal: #b24a35;
  --soft: #dde5eb;
  --soft-2: #cdd8e0;
  --bottom: #1f2d38;
}
[data-theme="dark"] {
  color-scheme: dark;
  --ink: #edf4ef;
  --muted: #a9b8af;
  --line: #416054;
  --paper: #0d1410;
  --panel: #17281f;
  --accent: #41d3ac;
  --accent-dark: #94ead6;
  --gold: #efb94d;
  --blue: #63aef2;
  --danger: #ff8a8f;
  --under-goal: #ffbd59;
  --soft: #dbeee6;
  --soft-2: #bfe4d6;
  --bottom: #050907;
}
[data-theme="dark"] .macro span,
[data-theme="dark"] .macro b,
[data-theme="dark"] .servings input,
[data-theme="dark"] .servings button,
[data-theme="dark"] .goal-actions .mini {
  color: #000000;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--soft) 0, var(--paper) 220px);
  color: var(--ink);
}
button, input, select { font: inherit; }
.app {
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 112px;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: -16px -16px 12px;
  padding: 14px 16px 12px;
  background: color-mix(in srgb, var(--paper) 82%, var(--soft));
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
}
h1 {
  margin: 0;
  font-size: 1.2rem;
  letter-spacing: 0;
}
.phase-select, .theme-select {
  width: 100%;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  padding: 12px;
}
.theme-select {
  margin-top: 0;
  max-width: 168px;
  padding: 9px 10px;
}
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 0 2px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.favorite-empty {
  color: var(--muted);
  font-size: .78rem;
  padding: 10px 2px 2px;
}
.tab {
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 74%, var(--soft));
  color: var(--muted);
  border-radius: 999px;
  padding: 9px 12px;
  white-space: nowrap;
}
.tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.top-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}
.favorite-toggle.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #1f1704;
}
.summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 12px 0;
}
.metric {
  background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 72%, var(--soft)));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.metric span {
  display: block;
  color: var(--muted);
  font-size: .76rem;
}
.metric strong {
  display: block;
  margin-top: 4px;
  font-size: 1.25rem;
}
.macro-chart {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 112px 1fr;
  gap: 14px;
  align-items: center;
  margin: 12px 0;
  background: linear-gradient(135deg, var(--panel), color-mix(in srgb, var(--panel) 62%, var(--soft)));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.donut {
  width: 112px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: conic-gradient(var(--gold) 0 var(--fat-end), var(--blue) var(--fat-end) var(--carb-end), var(--accent) var(--carb-end) 100%);
  display: grid;
  place-items: center;
}
.donut::after {
  content: "";
  width: 64px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--panel);
  box-shadow: inset 0 0 0 1px var(--line);
}
.chart-copy strong {
  display: block;
  font-size: 1.1rem;
}
.chart-copy span {
  display: block;
  color: var(--muted);
  font-size: .78rem;
  margin-top: 2px;
}
.goal-actions {
  margin-top: 10px;
}
.goal-grid {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.goal-card {
  background: color-mix(in srgb, var(--panel) 70%, var(--soft));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px;
}
.goal-card span {
  display: block;
  color: var(--muted);
  font-size: .68rem;
}
.goal-card strong {
  display: block;
  margin-top: 3px;
}
.goal-card small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
}
.goal-card.under {
  border-color: color-mix(in srgb, var(--under-goal) 62%, var(--line));
}
.goal-card.under strong,
.goal-card.under small {
  color: var(--under-goal);
}
.goal-card.over {
  border-color: color-mix(in srgb, var(--accent) 62%, var(--line));
}
.goal-card.over strong,
.goal-card.over small {
  color: var(--accent-dark);
}
.bar {
  height: 6px;
  overflow: hidden;
  background: var(--soft-2);
  border-radius: 999px;
  margin-top: 7px;
}
.bar i {
  display: block;
  height: 100%;
  width: min(var(--fill), 100%);
  background: var(--accent);
  border-radius: inherit;
}
.goal-card.under .bar i {
  background: var(--under-goal);
}
.goal-card.over .bar i {
  background: var(--accent);
}
.legend {
  display: grid;
  gap: 6px;
  margin-top: 10px;
}
.legend-row {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  gap: 8px;
  align-items: center;
  color: var(--muted);
  font-size: .78rem;
}
.swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.swatch.fat { background: var(--gold); }
.swatch.carbs { background: var(--blue); }
.swatch.protein { background: var(--accent); }
.toolbar {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin: 12px 0;
}
.search {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  background: color-mix(in srgb, var(--panel) 82%, var(--soft));
}
.ghost {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 12px;
  background: color-mix(in srgb, var(--panel) 76%, var(--soft));
  color: var(--accent-dark);
}
.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0;
}
.action-row.compact {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.active-toggle.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.primary {
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 12px;
  background: var(--accent);
  color: white;
}
.section-label {
  grid-column: 1 / -1;
  color: var(--muted);
  font-size: .78rem;
  font-weight: 750;
  padding: 4px 2px 0;
  text-transform: uppercase;
}
.food-group {
  grid-column: 1 / -1;
  margin-top: 6px;
  padding: 10px 2px 2px;
  color: var(--ink);
  font-size: .9rem;
  font-weight: 800;
}
.items {
  display: grid;
  gap: 10px;
}
.item {
  background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 80%, var(--soft)));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.item-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: start;
}
.item-name {
  font-weight: 750;
  line-height: 1.2;
}
.item-cat {
  margin-top: 3px;
  color: var(--muted);
  font-size: .78rem;
}
.item-tools {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.mini {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--soft);
  color: var(--accent-dark);
  min-height: 34px;
  padding: 0 10px;
}
.mini.danger {
  color: var(--danger);
}
.mini.add {
  border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
  color: white;
  background: var(--accent);
}
.macro-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  margin-top: 12px;
}
.macro {
  background: var(--soft-2);
  border-radius: 6px;
  padding: 7px 6px;
  text-align: center;
}
.macro span {
  display: block;
  font-size: .68rem;
  color: var(--muted);
}
.macro b {
  display: block;
  margin-top: 2px;
  font-size: .86rem;
}
.servings {
  display: grid;
  grid-template-columns: 36px 58px 36px;
  gap: 4px;
  align-items: center;
}
.servings button {
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--soft);
  color: var(--accent-dark);
  font-size: 1.2rem;
  line-height: 1;
}
.servings input {
  width: 58px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: center;
  background: white;
}
.subtotals {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  color: var(--muted);
  font-size: .78rem;
}
.bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  background: var(--bottom);
  color: white;
  border-top: 1px solid rgba(255,255,255,.15);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}
.bottom-grid {
  max-width: 760px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.bottom-cell {
  text-align: center;
}
.bottom-cell span {
  display: block;
  font-size: .66rem;
  color: rgba(255,255,255,.68);
}
.bottom-cell strong {
  display: block;
  margin-top: 2px;
  font-size: 1rem;
}
.empty {
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 24px;
  text-align: center;
  color: var(--muted);
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: end;
  background: rgba(16, 35, 29, .42);
}
.modal-backdrop.open {
  display: flex;
}
.modal {
  width: 100%;
  max-height: 88vh;
  overflow: auto;
  background: var(--panel);
  border-radius: 14px 14px 0 0;
  padding: 16px;
  box-shadow: 0 -18px 40px rgba(0,0,0,.18);
}
.modal h2 {
  margin: 0 0 12px;
  font-size: 1.05rem;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.field {
  display: grid;
  gap: 5px;
}
.field.full {
  grid-column: 1 / -1;
}
.field span {
  color: var(--muted);
  font-size: .75rem;
}
.field input {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px;
}
.modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}
@media (min-width: 720px) {
  .app {
    max-width: 760px;
    margin: 0 auto;
    padding-inline: 20px;
  }
  .topbar { margin-inline: -20px; padding-inline: 20px; }
  .summary { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .modal {
    max-width: 520px;
    margin: auto;
    border-radius: 12px;
  }
  .modal-backdrop {
    align-items: center;
  }
}
</style>
</head>

const STORAGE_KEY = "macroDataV2";
const THEME_KEY = "macroTheme";

const clone = (value) => JSON.parse(JSON.stringify(value));
const slug = (value) => String(value || "item").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "item";
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  "\"": "&quot;",
  "'": "&#39;"
}[char]));
const parseNumber = (value) => {
  const parsed = Number(String(value ?? "").replace(",", "").trim());
  return Number.isFinite(parsed) ? parsed : 0;
};
const DEFAULT_TARGETS = { calories: 0, fat: 0, carbs: 0, protein: 0 };

function canonicalName(name) {
  const cleaned = String(name || "").trim().replace(/\s+/g, " ");
  const key = cleaned.toLowerCase();
  const aliases = {
    "grd tky": "Ground Turkey",
    "ground turk": "Ground Turkey",
    "ground tky": "Ground Turkey",
    "protein pwd": "Protein Powder",
    "pb2": "PB Powder",
    "pb powder": "PB Powder",
    "cottage ch": "Cottage Cheese",
    "cottage chse": "Cottage Cheese",
    "shrd cheese": "Shredded Cheese",
    "shrd m cheese": "Shredded Mexican Cheese",
    "russet pot": "Russet Potato",
    "broc": "Broccoli",
    "broccili": "Broccoli",
    "broccli": "Broccoli",
    "crsuhed tom": "Crushed Tomato",
    "crushed tom": "Crushed Tomato",
    "tom": "Tomato",
    "tom ch": "Tomatoes",
    "pinot beans": "Pinto Beans",
    "pinto": "Pinto Beans",
    "bb": "Blueberries",
    "egg white": "Egg Whites",
    "egg whites": "Egg Whites",
    "egg": "Eggs",
    "milk": "Almond Milk",
    "zuccini": "Zucchini",
    "vegs": "Vegetables",
    "marina": "Marinara"
  };
  return aliases[key] || cleaned.replace(/\b\w/g, (char) => char.toUpperCase());
}

function prepareData(phases) {
  return phases.map((phase, phaseIndex) => {
    const used = {};
    const phaseId = phase.id || `${slug(phase.name)}-${phaseIndex}`;
    return {
      ...phase,
      id: phaseId,
      targets: { ...DEFAULT_TARGETS, ...(phase.targets || {}) },
      items: (phase.items || []).map((item, itemIndex) => {
        const base = slug(item.name);
        used[base] = (used[base] || 0) + 1;
        return {
          id: item.id || `${base}-${used[base]}-${itemIndex}`,
          name: canonicalName(item.name || "New food"),
          category: item.category || "",
          servings: parseNumber(item.servings),
          calories: parseNumber(item.calories),
          fat: parseNumber(item.fat),
          carbs: parseNumber(item.carbs),
          protein: parseNumber(item.protein)
        };
      })
    };
  });
}

  localStorage.setItem(THEME_KEY, state.theme);
}

function saveFavorites() {
  state.favoriteIds = state.favoriteIds.filter((id, index, ids) => DATA.some((phase) => phase.id === id) && ids.indexOf(id) === index);

  state.view = view;
  localStorage.setItem("macroView", view);

function copyCurrentPhase() {
  const phase = currentPhase();
  if (!phase) return;
  const name = prompt("Name for copied tab:", `${phase.name} Copy`);
  if (!name) return;
  const suffix = Date.now();
  const copied = {
    ...clone(phase),
    id: `${slug(name)}-${suffix}`,
    name: name.trim(),
    items: phase.items.map((item, index) => ({ ...clone(item), id: `${slug(item.name)}-${suffix}-${index}` }))
  };
  DATA.push(copied);
  state.phaseId = copied.id;
  setView("phase");
  saveData();
  render();

function setServings(phase, item, value) {
  if (!item) return;
  item.servings = Math.max(0, Math.round(parseNumber(value) * 2) / 2);
  saveData();
  renderSummary();
  renderItems();
}

function totalsFor(phase, items = phase.items) {
  return items.reduce((totals, item) => {
    const servings = getServings(phase, item);
    totals.calories += item.calories * servings;
    totals.fat += item.fat * servings;
    totals.carbs += item.carbs * servings;
    totals.protein += item.protein * servings;
    totals.servings += servings;
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0, servings: 0 });
}

function macroCalories(totals) {
  const fat = totals.fat * 9;
  const carbs = totals.carbs * 4;
  const protein = totals.protein * 4;
  const total = fat + carbs + protein || 1;
  return {
    fat,
    carbs,
    protein,
    total,
    fatPct: fat / total * 100,
    carbsPct: carbs / total * 100,
    proteinPct: protein / total * 100
  };
}

function foodKey(item) {
  return `${item.name.trim().toLowerCase()}|${item.calories}|${item.fat}|${item.carbs}|${item.protein}`;
}

function foodLibrary() {
  const map = new Map();
  DATA.forEach((phase) => {
    phase.items.forEach((item) => {
      const key = foodKey(item);
      if (!map.has(key)) map.set(key, { ...item, sources: [phase.name] });
      else map.get(key).sources.push(phase.name);
    });
  });
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
}

  const rawCategory = String(item.category || "").toLowerCase();
  const name = String(item.name || "").toLowerCase();
  const text = `${rawCategory} ${name}`;
  if (/\b(protein powder|protein pwd|pb powder|pb2|supplement)\b/.test(text)) return "Supplements";
  if (/\b(egg|eggs|egg white|chicken|turkey|tky|grd tky|ground turk|ground beef|beef|meat)\b/.test(text)) return "Protein";
  if (/\b(milk|almond milk|yogurt|greek yogurt|cottage|cheese|dairy)\b/.test(text)) return "Dairy";
  if (/\b(rice|cream of rice|grits|oat|oatmeal|pasta|bagel|bagels|bread|popcorn|rice cake|pot|russet|grain|granola)\b/.test(text)) return "Grains & Starches";
  if (/\b(banana|blueberries|berries|strawberries|mango|raisins|fruit|bb|frozen fruit)\b/.test(text)) return "Fruit";
  if (/\b(spinach|broc|broccoli|broccili|broccli|tom|tomato|crushed tom|petite diced|pepper|onion|beans|pinto|pinot|green beans|corn|carrot|squash|zucchini|zuccini|veg|vegs)\b/.test(text)) return "Vegetables";
  if (/\b(ketchup|sauce|marina|marinara|broth|misc|other)\b/.test(text)) return "Fats, Sauces & Extras";
  return "Other";
}

function groupedListHtml(phase, items, options = {}) {
  if (!items.length) return "";
  const groups = new Map(GROUP_ORDER.map((group) => [group, []]));
  items.forEach((item) => {
    const group = foodGroup(item);
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(item);
  });
  return [...groups.entries()]
    .filter(([, groupItems]) => groupItems.length)
    .map(([group, groupItems]) => `
      <div class="food-group">${esc(group)}</div>
      ${groupItems.map((item) => itemCard(phase, item, options)).join("")}
    `)
    .join("");
}

function phaseOptions(phase) {
  return DATA.map((entry) => `<option value="${esc(entry.id)}" ${entry.id === phase.id ? "selected" : ""}>${esc(entry.name)}</option>`).join("");
}

function themeOptions() {
  const themes = [
    ["forest", "Forest"],
    ["ocean", "Ocean"],
    ["sunrise", "Sunrise"],
    ["berry", "Berry"],
    ["graphite", "Graphite"],
    ["dark", "Dark"]
  ];
  return themes.map(([id, label]) => `<option value="${id}" ${state.theme === id ? "selected" : ""}>${label}</option>`).join("");
}

function favoriteTabs(phase) {
  const favorites = state.favoriteIds.map((id) => DATA.find((entry) => entry.id === id)).filter(Boolean);
  if (!favorites.length) return `<div class="favorite-empty">Favorite pages will show here.</div>`;
  return favorites.map((entry) => `<button class="tab ${entry.id === phase.id ? "active" : ""}" data-phase="${esc(entry.id)}">${esc(entry.name)}</button>`).join("");
}

function itemCard(phase, item, options = {}) {
  const servings = getServings(phase, item);
  const weeklyCal = item.calories * servings;
  const dailyCal = weeklyCal / 7;
  const isLibrary = options.library;
  const sourceText = item.sources?.length ? `From ${item.sources.slice(0, 2).join(", ")}` : "From library";
  return `
    <article class="item">
      <div class="item-head">
        <div>
          <div class="item-name">${esc(item.name)}</div>
          <div class="item-cat">${esc(item.category || (isLibrary ? sourceText : "Per serving"))} - ${fmt(item.calories)} cal</div>
        </div>
        ${isLibrary ? `<button class="mini add" data-add-library="${esc(item.id)}">Add</button>` : `
          <div class="servings" aria-label="Weekly servings for ${esc(item.name)}">
            <button data-step="-0.5" data-item-id="${esc(item.id)}" aria-label="Remove serving">-</button>
            <input inputmode="decimal" value="${fmt(servings)}" data-input-id="${esc(item.id)}" aria-label="Weekly servings">
            <button data-step="0.5" data-item-id="${esc(item.id)}" aria-label="Add serving">+</button>
          </div>
        `}
      </div>
      <div class="macro-grid">
        <div class="macro"><span>Cal</span><b>${fmt(item.calories)}</b></div>
        <div class="macro"><span>Fat</span><b>${fmt(item.fat)}g</b></div>
        <div class="macro"><span>Carbs</span><b>${fmt(item.carbs)}g</b></div>
        <div class="macro"><span>Protein</span><b>${fmt(item.protein)}g</b></div>
      </div>
      ${isLibrary ? "" : `
        <div class="subtotals">
          <span>${fmt(weeklyCal)} weekly cal</span>
          <span>${fmt(dailyCal)} daily cal avg</span>
        </div>
        <div class="item-tools">
          <button class="mini" data-edit-item="${esc(item.id)}">Edit</button>
          <button class="mini danger" data-delete-item="${esc(item.id)}">Delete</button>
        </div>
      `}
    </article>
  `;
}

function renderSummary() {
  const phase = currentPhase();
  if (!phase) return;
  const weekly = totalsFor(phase);
  const targets = { ...DEFAULT_TARGETS, ...(phase.targets || {}) };
  const macroCal = macroCalories(weekly);
  const fatEnd = macroCal.fatPct;
  const carbEnd = macroCal.fatPct + macroCal.carbsPct;
  const daily = {
    calories: weekly.calories / 7,
    fat: weekly.fat / 7,
    carbs: weekly.carbs / 7,
    protein: weekly.protein / 7
  };
  const summary = document.querySelector("[data-summary]");
  const bottom = document.querySelector("[data-bottom]");
  const goalCard = (label, actual, target, unit = "") => {
    const fill = target > 0 ? Math.min(actual / target * 100, 120) : 0;
    const remaining = target > 0 ? target - actual : 0;
    const status = target > 0 && remaining > 0 ? "under" : target > 0 && remaining < 0 ? "over" : "";
    const remainingText = target > 0 ? `${remaining >= 0 ? fmt(remaining) + unit + " left" : fmt(Math.abs(remaining)) + unit + " over"}` : "No goal set";
    return `
      <div class="goal-card ${status}">
        <span>${label}</span>
        <strong>${fmt(actual)}${unit} / ${target ? fmt(target) + unit : "--"}</strong>
        <small>${remainingText}</small>
        <div class="bar"><i style="--fill:${fill}%"></i></div>
      </div>
    `;
  };
  if (summary) {
    summary.innerHTML = `
      <div class="metric"><span>Daily Calories</span><strong>${fmt(daily.calories)}</strong></div>
      <div class="metric"><span>Daily Protein</span><strong>${fmt(daily.protein)}g</strong></div>
      <div class="metric"><span>Weekly Calories</span><strong>${fmt(weekly.calories)}</strong></div>
      <div class="metric"><span>Weekly Servings</span><strong>${fmt(weekly.servings)}</strong></div>
      <div class="macro-chart">
        <div class="donut" style="--fat-end:${fatEnd}%; --carb-end:${carbEnd}%"></div>
        <div class="chart-copy">
          <strong>Macro Calories</strong>
          <span>Fat, carbs, and protein calorie split</span>
          <div class="goal-actions"><button class="mini" data-edit-goals>Edit Goals</button></div>
          <div class="legend">
            <div class="legend-row"><i class="swatch fat"></i><span>Fat</span><b>${fmt(macroCal.fatPct)}%</b></div>
            <div class="legend-row"><i class="swatch carbs"></i><span>Carbs</span><b>${fmt(macroCal.carbsPct)}%</b></div>
            <div class="legend-row"><i class="swatch protein"></i><span>Protein</span><b>${fmt(macroCal.proteinPct)}%</b></div>
          </div>
        </div>
        <div class="goal-grid">
          ${goalCard("Calories", daily.calories, targets.calories)}
          ${goalCard("Fat", daily.fat, targets.fat, "g")}
          ${goalCard("Carbs", daily.carbs, targets.carbs, "g")}
          ${goalCard("Protein", daily.protein, targets.protein, "g")}
        </div>
      </div>
    `;
  }
  if (bottom) {
    bottom.innerHTML = `
      <div class="bottom-cell"><span>Cal</span><strong>${fmt(daily.calories)}</strong></div>
      <div class="bottom-cell"><span>Fat</span><strong>${fmt(daily.fat)}g</strong></div>
      <div class="bottom-cell"><span>Carbs</span><strong>${fmt(daily.carbs)}g</strong></div>
      <div class="bottom-cell"><span>Protein</span><strong>${fmt(daily.protein)}g</strong></div>
    `;
  }
}

function renderItems() {
  const phase = currentPhase();
  if (!phase) return;
  const query = state.query.trim().toLowerCase();
  const currentMatches = phase.items.filter((item) => (!state.activeOnly || getServings(phase, item) > 0) && (!query || item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query)));
  const currentKeys = new Set(phase.items.map(foodKey));
  const libraryMatches = foodLibrary()
    .filter((item) => (!query || item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query)) && !currentKeys.has(foodKey(item)))
    .slice(0, query ? 30 : Number.POSITIVE_INFINITY);
  const list = document.querySelector("[data-items]");
  if (!list) return;
  const currentHtml = currentMatches.length
    ? groupedListHtml(phase, currentMatches)
    : `<div class="empty">No foods in this tab match this search.</div>`;
  const libraryHtml = libraryMatches.length
    ? `<div class="section-label">Food library from all tabs${query ? "" : " - all foods"}</div>${groupedListHtml(phase, libraryMatches, { library: true })}`
    : "";
  list.innerHTML = currentHtml + libraryHtml;
}

function renderModal() {
  const modalRoot = document.querySelector("[data-modal-root]");
  if (!modalRoot) return;
  if (!state.modal) {
    modalRoot.innerHTML = "";
    return;
  }
  const phase = currentPhase();
  const item = state.modal.itemId ? phase.items.find((entry) => entry.id === state.modal.itemId) : null;
  const isTab = state.modal.type === "tab";
  const isGoals = state.modal.type === "goals";
  const title = isGoals ? "Daily Goals" : isTab ? "Add Tab" : item ? "Edit Food" : "Add Food";
  const values = item || { name: "", category: "", servings: 0, calories: 0, fat: 0, carbs: 0, protein: 0 };
  const targets = { ...DEFAULT_TARGETS, ...(phase.targets || {}) };
  modalRoot.innerHTML = `
    <div class="modal-backdrop open" data-close-modal>
      <form class="modal" data-food-form data-form-type="${esc(state.modal.type)}" data-form-item="${esc(state.modal.itemId || "")}">
        <h2>${title}</h2>
        ${isGoals ? `
          <div class="form-grid">
            <label class="field"><span>Daily calories</span><input name="goalCalories" inputmode="decimal" value="${fmt(targets.calories)}"></label>
            <label class="field"><span>Daily fat</span><input name="goalFat" inputmode="decimal" value="${fmt(targets.fat)}"></label>
            <label class="field"><span>Daily carbs</span><input name="goalCarbs" inputmode="decimal" value="${fmt(targets.carbs)}"></label>
            <label class="field"><span>Daily protein</span><input name="goalProtein" inputmode="decimal" value="${fmt(targets.protein)}"></label>
          </div>
        ` : isTab ? `
          <div class="form-grid">
            <label class="field full"><span>Tab name</span><input name="tabName" required placeholder="Example: Fall Cut"></label>
          </div>
        ` : `
          <div class="form-grid">
            <label class="field full"><span>Food name</span><input name="name" required value="${esc(values.name)}"></label>
            <label class="field full"><span>Category or note</span><input name="category" value="${esc(values.category)}"></label>
            <label class="field"><span>Weekly servings</span><input name="servings" inputmode="decimal" value="${fmt(values.servings)}"></label>
            <label class="field"><span>Calories</span><input name="calories" inputmode="decimal" value="${fmt(values.calories)}"></label>
            <label class="field"><span>Fat</span><input name="fat" inputmode="decimal" value="${fmt(values.fat)}"></label>
            <label class="field"><span>Carbs</span><input name="carbs" inputmode="decimal" value="${fmt(values.carbs)}"></label>
            <label class="field"><span>Protein</span><input name="protein" inputmode="decimal" value="${fmt(values.protein)}"></label>
          </div>
        `}
        <div class="modal-actions">
          <button class="ghost" type="button" data-cancel>Cancel</button>
          <button class="primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  `;
}

function renderFoodBank() {
  const query = state.query.trim().toLowerCase();
  const items = foodLibrary().filter((item) => !query || item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query));
  document.querySelector("#app").innerHTML = `
    <div class="topbar">
      <div class="title-row">
        <h1>Food Bank</h1>
        <select class="theme-select" data-theme-select aria-label="Color theme">${themeOptions()}</select>
      </div>
      <button class="ghost" data-back-phase>Back to Phases</button>
    </div>
    <div class="toolbar">
      <input class="search" type="search" placeholder="Search food bank" value="${esc(state.query)}" data-search>
      <button class="ghost" data-clear>Clear</button>
    </div>
    <main class="items" data-items>
      ${items.length ? groupedListHtml(currentPhase(), items, { library: true }) : `<div class="empty">No foods found.</div>`}
    </main>
    <div data-modal-root></div>
  `;
  renderModal();
}

function render() {
  const phase = currentPhase();
  if (!phase) return;
  applyTheme();
  saveFavorites();
  if (state.view === "bank") {
    renderFoodBank();
    return;
  }
  const isFavorite = state.favoriteIds.includes(phase.id);
  localStorage.setItem("macroPhase", phase.id);
  document.querySelector("#app").innerHTML = `
    <div class="topbar">
      <div class="title-row">
        <h1>Macro Phases</h1>
        <select class="theme-select" data-theme-select aria-label="Color theme">${themeOptions()}</select>
      </div>
      <select class="phase-select" data-select>${phaseOptions(phase)}</select>
      <div class="top-actions">
        <button class="ghost favorite-toggle ${isFavorite ? "active" : ""}" data-toggle-favorite>${isFavorite ? "Favorited" : "Favorite Page"}</button>
        <button class="ghost" data-open-bank>Food Bank</button>
      </div>
      <div class="tabs">${favoriteTabs(phase)}</div>
    </div>
    <section class="summary" data-summary></section>
    <div class="action-row compact">
      <button class="primary" data-open-add-food>Add Food</button>
      <button class="ghost" data-open-add-tab>Add Tab</button>
      <button class="ghost" data-copy-phase>Copy Tab</button>
      <button class="ghost active-toggle ${state.activeOnly ? "active" : ""}" data-toggle-active>${state.activeOnly ? "Active Only" : "Show All"}</button>
    </div>
    <div class="toolbar">
      <input class="search" type="search" placeholder="Search foods" value="${esc(state.query)}" data-search>
      <button class="ghost" data-clear>Clear</button>
    </div>
    <main class="items" data-items></main>
    <footer class="bottom">
      <div class="bottom-grid" data-bottom></div>
    </footer>
    <div data-modal-root></div>
  `;
  renderSummary();
  renderItems();
  renderModal();
}

document.addEventListener("click", (event) => {
  if (event.target.closest("[data-close-modal]") && !event.target.closest(".modal")) {
    state.modal = null;
    renderModal();
    return;
  }
  if (event.target.closest("[data-cancel]")) {
    state.modal = null;
    renderModal();
    return;
  }
  if (event.target.closest("[data-open-bank]")) {
    setView("bank");
    state.query = "";
    render();
    return;
  }
  if (event.target.closest("[data-back-phase]")) {
    setView("phase");
    state.query = "";
    render();
    return;
  }
  if (event.target.closest("[data-copy-phase]")) {
    copyCurrentPhase();
    return;
  }
  if (event.target.closest("[data-toggle-active]")) {
    state.activeOnly = !state.activeOnly;
    localStorage.setItem("macroActiveOnly", String(state.activeOnly));
    render();
    return;
  }
  if (event.target.closest("[data-edit-goals]")) {
    state.modal = { type: "goals" };
    renderModal();
    return;
  }
  const phaseButton = event.target.closest("[data-phase]");
  if (phaseButton) {
    state.phaseId = phaseButton.dataset.phase;
    render();
    return;
  }
  if (event.target.closest("[data-toggle-favorite]")) {
    const phase = currentPhase();
    if (state.favoriteIds.includes(phase.id)) {
      state.favoriteIds = state.favoriteIds.filter((id) => id !== phase.id);
    } else {
      state.favoriteIds.push(phase.id);
    }
    saveFavorites();
    render();
    return;
  }
  const stepButton = event.target.closest("[data-step]");
  if (stepButton) {
    const phase = currentPhase();
    const item = phase.items.find((entry) => entry.id === stepButton.dataset.itemId);
    setServings(phase, item, getServings(phase, item) + Number(stepButton.dataset.step));
    return;
  }
  const editButton = event.target.closest("[data-edit-item]");
  if (editButton) {
    state.modal = { type: "food", itemId: editButton.dataset.editItem };
    renderModal();
    return;
  }
  const deleteButton = event.target.closest("[data-delete-item]");
  if (deleteButton) {
    const phase = currentPhase();
    const item = phase.items.find((entry) => entry.id === deleteButton.dataset.deleteItem);
    if (item && confirm(`Delete ${item.name} from this tab?`)) {
      phase.items = phase.items.filter((entry) => entry.id !== item.id);
      saveData();
      render();
    }
    return;
  }
  const addLibraryButton = event.target.closest("[data-add-library]");
  if (addLibraryButton) {
    const phase = currentPhase();
    const item = foodLibrary().find((entry) => entry.id === addLibraryButton.dataset.addLibrary);
    if (item) {
      const servings = prompt(`Weekly servings for ${item.name}:`, "0");
      if (servings === null) return;
      phase.items.push({ ...item, id: `${slug(item.name)}-${Date.now()}`, servings: parseNumber(servings), sources: undefined });
      saveData();
      setView("phase");
      render();
    }
    return;
  }
  if (event.target.closest("[data-open-add-food]")) {
    state.modal = { type: "food" };
    renderModal();
    return;
  }
  if (event.target.closest("[data-open-add-tab]")) {
    state.modal = { type: "tab" };
    renderModal();
    return;
  }
  if (event.target.closest("[data-clear]")) {
    state.query = "";
    render();
    return;
  }
  if (event.target.closest("[data-reset]")) {
    if (confirm("Reset all edits and serving changes back to the original spreadsheet?")) {
      DATA = prepareData(clone(ORIGINAL_DATA));
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem("macroServings");
      localStorage.removeItem("macroActiveOnly");
      state.favoriteIds = [];
      localStorage.removeItem(FAVORITES_KEY);
      state.phaseId = DATA[0]?.id;
      state.activeOnly = false;
      setView("phase");
      render();
    }
  }
});

document.addEventListener("input", (event) => {
  if (event.target.matches("[data-search]")) {
    state.query = event.target.value;
    if (state.view === "bank") renderFoodBank();
    else renderItems();
  }
});

document.addEventListener("change", (event) => {
  if (event.target.matches("[data-theme-select]")) {
    state.theme = event.target.value;
    applyTheme();
    renderSummary();
    return;
  }
  if (event.target.matches("[data-select]")) {
    state.phaseId = event.target.value;
    render();
    return;
  }
  if (event.target.matches("[data-input-id]")) {
    const phase = currentPhase();
    const item = phase.items.find((entry) => entry.id === event.target.dataset.inputId);
    setServings(phase, item, event.target.value);
  }
});

document.addEventListener("submit", (event) => {
  const form = event.target.closest("[data-food-form]");
  if (!form) return;
  event.preventDefault();
  const phase = currentPhase();
  const formData = new FormData(form);
  if (form.dataset.formType === "tab") {
    const name = String(formData.get("tabName") || "").trim();
    if (!name) return;
    const id = `${slug(name)}-${Date.now()}`;
    DATA.push({ id, name, targets: { ...DEFAULT_TARGETS }, items: [] });
    state.phaseId = id;
  } else if (form.dataset.formType === "goals") {
    phase.targets = {
      calories: parseNumber(formData.get("goalCalories")),
      fat: parseNumber(formData.get("goalFat")),
      carbs: parseNumber(formData.get("goalCarbs")),
      protein: parseNumber(formData.get("goalProtein"))
    };
  } else {
    const itemData = {
      id: form.dataset.formItem || `${slug(formData.get("name"))}-${Date.now()}`,
      name: String(formData.get("name") || "").trim() || "New food",
      category: String(formData.get("category") || "").trim(),
      servings: parseNumber(formData.get("servings")),
      calories: parseNumber(formData.get("calories")),
      fat: parseNumber(formData.get("fat")),
      carbs: parseNumber(formData.get("carbs")),
      protein: parseNumber(formData.get("protein"))
    };
    const existingIndex = phase.items.findIndex((item) => item.id === itemData.id);
    if (existingIndex >= 0) phase.items[existingIndex] = itemData;
    else phase.items.push(itemData);
  }
  saveData();
  state.modal = null;
  render();
});

applyTheme();
render();
</script>
</body>
</html>
