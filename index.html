[data-theme="graphite"] {
  --ink: #1d2227;
  --muted: #68717a;
  --line: #c3cbd2;
  --paper: #edf1f4;
  --panel: #fbfcfd;
  --accent: #3f5f7a;
  --accent-dark: #24394b;
  --gold: #c48d1f;
  --blue: #167ca5;
  --danger: #a64045;
  --under-goal: #b24a35;
  --soft: #dde5eb;
  --soft-2: #cdd8e0;
  --bottom: #1f2d38;
}
[data-theme="dark"] {
  color-scheme: dark;
  --ink: #edf4ef;
  --muted: #a9b8af;
  --line: #416054;
  --paper: #0d1410;
  --panel: #17281f;
  --accent: #41d3ac;
  --accent-dark: #94ead6;
  --gold: #efb94d;
  --blue: #63aef2;
  --danger: #ff8a8f;
  --under-goal: #ffbd59;
  --soft: #dbeee6;
  --soft-2: #bfe4d6;
  --box-bg: #21382c;
  --box-bg-soft: #294536;
  --bottom: #050907;
}
[data-theme="dark"] .macro span,
[data-theme="dark"] .macro b,
[data-theme="dark"] .servings input,
[data-theme="dark"] .servings button,
[data-theme="dark"] .goal-actions .mini {
  color: #000000;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--soft) 0, var(--paper) 220px);
  color: var(--ink);
}
button, input, select { font: inherit; }
button,
[data-view-target],
[data-training-day],
.tab,
.home-card,
.cal-cell {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .14s ease, border-color .14s ease, color .14s ease, transform .08s ease, filter .14s ease, box-shadow .14s ease;
}
button:hover,
.home-card:hover,
.tab:hover,
.cal-cell:hover {
  filter: brightness(1.04) saturate(1.08);
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
}
button:active,
.home-card:active,
.tab:active,
.cal-cell:active {
  transform: scale(.985);
  filter: brightness(.96) saturate(1.12);
}
.app {
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 112px;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: -16px -16px 12px;
  padding: 14px 16px 12px;
  background: color-mix(in srgb, var(--paper) 82%, var(--soft));
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
}
.title-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
h1 {
  margin: 0;
  font-size: 1.2rem;
  letter-spacing: 0;
}
.info-button {
  width: 30px;
  height: 30px;
  min-height: 30px;
  display: grid;
  place-items: center;
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
  border-radius: 50%;
  background: var(--box-bg);
  color: var(--accent-dark);
  font-weight: 900;
  padding: 0;
}
.phase-select, .theme-select {
  width: 100%;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  padding: 12px;
}
.theme-select {
  margin-top: 0;
  max-width: 168px;
  padding: 9px 10px;
}
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 0 2px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.favorite-empty {
  color: var(--muted);
  font-size: .78rem;
  padding: 10px 2px 2px;
}
.tab {
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 74%, var(--soft));
  color: var(--muted);
  border-radius: 999px;
  padding: 9px 12px;
  white-space: nowrap;
}
.tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.top-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}
.favorite-toggle.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #1f1704;
}
.summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 12px 0;
}
.home-hero {
  background: linear-gradient(135deg, var(--panel), color-mix(in srgb, var(--panel) 46%, var(--soft)));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin: 10px 0;
}
.home-hero h2 {
  margin: 0;
  font-size: 1.15rem;
}
.home-hero p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: .82rem;
}
.profile-stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.profile-stat {
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
  border-radius: 8px;
  padding: 8px;
  background: color-mix(in srgb, var(--panel) 70%, var(--soft));
}
.profile-stat span {
  display: block;
  color: var(--muted);
  font-size: .68rem;
}
.profile-stat strong {
  display: block;
  margin-top: 2px;
  font-size: 1rem;
}
.home-snapshot {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin: 10px 0;
  background: linear-gradient(135deg, var(--panel), color-mix(in srgb, var(--panel) 55%, var(--soft)));
}
.goal-focus {
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
  border-radius: 8px;
  padding: 10px;
  margin: 10px 0;
  background: linear-gradient(135deg, var(--box-bg), var(--box-bg-soft));
}
.goal-focus-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}
.goal-focus h2 {
  margin: 0;
  font-size: .98rem;
}
.goal-focus-head span {
  color: var(--muted);
  font-size: .72rem;
  white-space: nowrap;
}
.goal-focus-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  margin-top: 8px;
}
.goal-tip {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  background: color-mix(in srgb, var(--panel) 88%, var(--soft));
}
.goal-tip strong,
.goal-tip span {
  display: block;
}
.goal-tip strong {
  font-size: .76rem;
}
.goal-tip span {
  margin-top: 2px;
  color: var(--muted);
  font-size: .72rem;
  line-height: 1.25;
}
.home-snapshot h2 {
  margin: 0 0 10px;
  font-size: 1rem;
}
.snapshot-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
}
.snapshot-card {
  min-width: 0;
  display: grid;
  justify-items: center;
  gap: 5px;
  border: 1px solid color-mix(in srgb, var(--snap-color) 35%, var(--line));
  border-radius: 8px;
  padding: 8px 5px;
  background: color-mix(in srgb, var(--panel) 72%, var(--soft));
  text-align: center;
}
.snapshot-donut {
  width: 42px;
  aspect-ratio: 1;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--snap-color) 0 var(--snap-fill), var(--soft-2) var(--snap-fill) 100%);
}
.snapshot-donut::after {
  content: "";
  width: 24px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--panel);
  box-shadow: inset 0 0 0 1px var(--line);
}
.snapshot-card span {
  color: var(--muted);
  font-size: .66rem;
  font-weight: 750;
}
.snapshot-card strong {
  color: var(--ink);
  font-size: .78rem;
  line-height: 1.1;
}
.home-tools {
  margin: 8px 0 12px;
}
.mini-panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin: 12px 0;
  background: color-mix(in srgb, var(--panel) 78%, var(--soft));
}
.mini-panel h2 {
  margin: 0 0 8px;
  font-size: 1rem;
}
.panel-title-row,
.compact-list > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.inline-form {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}
.inline-form input,
.compact-select {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: var(--panel);
  color: var(--ink);
}
.sparkline {
  width: 100%;
  height: 90px;
  margin-top: 8px;
  border-radius: 8px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--soft) 70%, var(--panel)), var(--panel));
}
.chip-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.food-chip {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  background: var(--panel);
  color: var(--ink);
  text-align: left;
}
.food-chip strong,
.food-chip span {
  display: block;
  white-space: nowrap;
}
.food-chip span {
  color: var(--muted);
  font-size: .72rem;
}
.favorite-food.active,
.done.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.today-adjust {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  color: var(--muted);
  font-size: .72rem;
}
.today-adjust .mini {
  min-height: 26px;
  padding: 3px 8px;
}
.compact-list {
  display: grid;
  gap: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.compact-list > div {
  border-bottom: 1px solid var(--line);
  padding: 11px 12px;
  background: color-mix(in srgb, var(--panel) 84%, var(--soft));
}
.compact-list > div:last-child {
  border-bottom: 0;
}
.grocery-tools {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  align-items: end;
  margin-bottom: 10px;
}
.grocery-tools .field {
  min-width: 0;
}
.grocery-tools button {
  min-height: 38px;
}
.help-list {
  display: grid;
  gap: 9px;
}
.help-list div {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: linear-gradient(135deg, var(--box-bg), var(--box-bg-soft));
}
.help-list strong,
.help-list span {
  display: block;
}
.help-list strong {
  font-size: .92rem;
}
.help-list span {

.meal-row-macros {
  color: var(--muted);
  font-size: .72rem;
}
.meal-row-right {
  display: grid;
  justify-items: end;
  gap: 5px;
}
.meal-row .servings {
  grid-template-columns: 30px 46px 30px;
}
.meal-row .servings button {
  width: 30px;
  height: 30px;
}
.meal-row .servings input {
  width: 46px;
  height: 30px;
  font-size: .82rem;
}
.meal-row-totals {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  padding: 9px;
  background: color-mix(in srgb, var(--panel) 62%, var(--soft));
  border-top: 1px solid var(--line);
}
.meal-row-totals span {
  display: grid;
  gap: 2px;
  color: var(--muted);
  font-size: .68rem;
  text-align: center;
}
.meal-row-totals b {
  color: var(--ink);
  font-size: .82rem;
}
.item {
  background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 80%, var(--soft)));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.item-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: start;
}
.item-name {
  font-weight: 750;
  line-height: 1.2;
}
.item-cat {
  margin-top: 3px;
  color: var(--muted);
  font-size: .78rem;
}
.item-tools {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.library-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
.mini {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--soft);
  color: var(--accent-dark);
  min-height: 34px;
  padding: 0 10px;
}
.mini.danger {
  color: var(--danger);
}
.mini.add {
  border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
  color: white;
  background: var(--accent);
}
.macro-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  margin-top: 12px;
}
.macro {
  background: var(--soft-2);
  border-radius: 6px;
  padding: 7px 6px;
  text-align: center;
}
.macro span {
  display: block;
  font-size: .68rem;
  color: var(--muted);
}
.macro b {
  display: block;
  margin-top: 2px;
  font-size: .86rem;
}
.servings {
  display: grid;
  grid-template-columns: 36px 58px 36px;
  gap: 4px;
  align-items: center;
}
.servings button {
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--soft);
  color: var(--accent-dark);
  font-size: 1.2rem;
  line-height: 1;
}
.servings input {
  width: 58px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: center;
  background: white;
}
.subtotals {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  color: var(--muted);
  font-size: .78rem;
}
.bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  background: var(--bottom);
  color: white;
  border-top: 1px solid rgba(255,255,255,.15);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}
.bottom-grid {
  max-width: 760px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.bottom-cell {
  text-align: center;
}
.bottom-cell span {
  display: block;
  font-size: .66rem;
  color: rgba(255,255,255,.68);
}
.bottom-cell strong {
  display: block;
  margin-top: 2px;
  font-size: 1rem;
}
.empty {
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 24px;
  text-align: center;
  color: var(--muted);
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: end;
  background: rgba(16, 35, 29, .42);
}
.modal-backdrop.open {
  display: flex;
}
.modal {
  width: 100%;
  max-height: 88vh;
  overflow: auto;
  background: var(--panel);
  border-radius: 14px 14px 0 0;
  padding: 16px;
  box-shadow: 0 -18px 40px rgba(0,0,0,.18);
}
.modal h2 {
  margin: 0 0 12px;
  font-size: 1.05rem;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.field {
  display: grid;
  gap: 5px;
}
.field.full {
  grid-column: 1 / -1;
}
.field span {
  color: var(--muted);
  font-size: .75rem;
}
.field input {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px;
}
.field select {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px;
  background: var(--panel);
  color: var(--ink);
}
.modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}
.home-hero,
.goal-focus,
.goal-tip,
.home-snapshot,
.mini-panel,
.metric,
.profile-stat,
.snapshot-card,
.food-chip,
.plan-tool-main,
.template-panel,
.compact-list > div,
.archive-section,
.month-summary,
.macro-chart,
.goal-card,
.slot-card,
.meal-items,
.item {
  background: linear-gradient(135deg, var(--box-bg), var(--box-bg-soft)) !important;
}
@media (max-width: 430px) {
  .plan-tools {
    grid-template-columns: 1fr;
  }
  .plan-tool-main,
  .template-panel {
    min-height: auto;
    grid-template-columns: 1fr;
  }
  .template-save-row {
    grid-template-columns: 1fr;
  }
  .grocery-tools {
    grid-template-columns: 1fr 1fr;
  }
  .grocery-tools .field {
    grid-column: 1 / -1;
  }
}
@media (min-width: 720px) {
  .app {
    max-width: 760px;
    margin: 0 auto;
    padding-inline: 20px;
  }
  .topbar { margin-inline: -20px; padding-inline: 20px; }
  .summary { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .modal {
    max-width: 520px;
    margin: auto;
    border-radius: 12px;
  }
  .modal-backdrop {
    align-items: center;
  }
}
</style>

function canonicalName(name) {
  const cleaned = String(name || "").trim().replace(/\s+/g, " ");
  const key = cleaned.toLowerCase();
  const aliases = {
    "grd tky": "Ground Turkey",
    "ground turk": "Ground Turkey",
    "ground tky": "Ground Turkey",
    "protein pwd": "Protein Powder",
    "pb2": "PB Powder",
    "pb powder": "PB Powder",
    "cottage ch": "Cottage Cheese",
    "cottage chse": "Cottage Cheese",
    "shrd cheese": "Shredded Cheese",
    "shrd m cheese": "Shredded Mexican Cheese",
    "russet pot": "Russet Potato",
    "broc": "Broccoli",
    "broccili": "Broccoli",
    "broccli": "Broccoli",
    "crsuhed tom": "Crushed Tomato",
    "crushed tom": "Crushed Tomato",
    "tom": "Tomato",
    "tom ch": "Tomatoes",
    "pinot beans": "Pinto Beans",
    "pinto": "Pinto Beans",
    "bb": "Blueberries",
    "egg white": "Egg Whites",
    "egg whites": "Egg Whites",
    "egg": "Eggs",
    "milk": "Almond Milk",
    "zuccini": "Zucchini",
    "vegs": "Vegetables",
    "marina": "Marinara"
  };
  return aliases[key] || cleaned.replace(/\b\w/g, (char) => char.toUpperCase());
}

function prepareData(phases) {
  return phases.map((phase, phaseIndex) => {
    const used = {};
    const phaseId = phase.id || `${slug(phase.name)}-${phaseIndex}`;
    return {
      ...phase,
      id: phaseId,
      targets: { ...DEFAULT_TARGETS, ...(phase.targets || {}) },
      items: (phase.items || []).map((item, itemIndex) => {
        const base = slug(item.name);
        used[base] = (used[base] || 0) + 1;
        return {
          id: item.id || `${base}-${used[base]}-${itemIndex}`,
          name: canonicalName(item.name || "New food"),
          category: item.category || "",
          servings: parseNumber(item.servings),
          calories: parseNumber(item.calories),
          fat: parseNumber(item.fat),
          carbs: parseNumber(item.carbs),
          protein: parseNumber(item.protein)
        };
      })
    };
  });
}

function userDataBackup() {
  const backup = {};
  USER_DATA_KEYS.forEach((key) => {
    const value = localStorage.getItem(key);
    if (value !== null) backup[key] = value;
  });
  return { created: new Date().toISOString(), backup };
}

function savePendingUpdateBackup() {
  localStorage.setItem(UPDATE_BACKUP_KEY, JSON.stringify(userDataBackup()));
}

function restorePendingUpdateBackup() {
  const raw = localStorage.getItem(UPDATE_BACKUP_KEY);
  if (!raw) return false;

function playThemeSound(theme) {
  const clips = {

    goggins: "assets/sounds/goggins-boats.mp3"
  };
  if (playThemeSound.audio) {
    playThemeSound.audio.pause();
    playThemeSound.audio.currentTime = 0;
  }
  const fallback = () => playThemeTone(theme);
  if (!clips[theme]) {
    fallback();
    return;
  }
  const audio = new Audio(clips[theme]);
  playThemeSound.audio = audio;
  audio.volume = 0.75;
  audio.currentTime = 0;
  let handledError = false;
  const stopTimer = window.setTimeout(() => {
    audio.pause();
    audio.currentTime = 0;
  }, 5000);
  audio.addEventListener("error", () => {
    if (handledError) return;
    handledError = true;
    window.clearTimeout(stopTimer);
    fallback();
  }, { once: true });
  audio.play().catch(() => {
    if (handledError) return;
    handledError = true;
    window.clearTimeout(stopTimer);
    fallback();
  });
}

function playThemeTone(theme) {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  const context = playThemeTone.context || new AudioContext();
  playThemeTone.context = context;
  if (context.state === "suspended") context.resume();
  const now = context.currentTime;
  const master = context.createGain();
  master.gain.setValueAtTime(0.0001, now);
  master.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
  master.gain.exponentialRampToValueAtTime(0.0001, now + 0.75);
  master.connect(context.destination);
  const tone = (frequency, start, duration, type = "sine", volume = 1, endFrequency = frequency) => {
    const osc = context.createOscillator();
    const gain = context.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(frequency, now + start);
    if (endFrequency !== frequency) osc.frequency.exponentialRampToValueAtTime(endFrequency, now + start + duration);
    gain.gain.setValueAtTime(0.0001, now + start);
    gain.gain.exponentialRampToValueAtTime(0.22 * volume, now + start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + start + duration);
    osc.connect(gain);
    gain.connect(master);
    osc.start(now + start);
    osc.stop(now + start + duration + 0.03);
  };
  const noise = (start, duration, volume = 0.35) => {
    const buffer = context.createBuffer(1, Math.max(1, Math.floor(context.sampleRate * duration)), context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const source = context.createBufferSource();
    const gain = context.createGain();
    const filter = context.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(760, now + start);
    gain.gain.setValueAtTime(0.0001, now + start);
    gain.gain.exponentialRampToValueAtTime(0.2 * volume, now + start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + start + duration);
    source.buffer = buffer;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    source.start(now + start);
  };
  const sounds = {
    original: () => { tone(392, 0, 0.12, "triangle", 0.45); tone(523, 0.11, 0.18, "triangle", 0.5); },
    sunrise: () => { tone(440, 0, 0.1, "sine", 0.45); tone(554, 0.08, 0.1, "sine", 0.45); tone(659, 0.16, 0.18, "sine", 0.5); },
    berry: () => { tone(659, 0, 0.08, "square", 0.28); tone(784, 0.08, 0.09, "square", 0.25); tone(587, 0.17, 0.14, "triangle", 0.35); },
    starwars: () => { tone(90, 0, 0.42, "sawtooth", 0.42, 185); tone(185, 0.08, 0.36, "sawtooth", 0.28, 92); noise(0.02, 0.38, 0.22); },
    unc: () => { tone(523, 0, 0.12, "triangle", 0.45); tone(659, 0.1, 0.12, "triangle", 0.45); tone(784, 0.2, 0.2, "triangle", 0.48); },
    goggins: () => { tone(82, 0, 0.12, "square", 0.5); noise(0, 0.16, 0.32); tone(110, 0.18, 0.18, "sawtooth", 0.35); }
  };
  (sounds[theme] || sounds.original)();
}

function registerOfflineApp() {

      registration.update().catch(() => {});

      registration.addEventListener("updatefound", () => {

    totals.servings += servings;
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0, servings: 0 });
}

function macroCalories(totals) {
  const fat = totals.fat * 9;
  const carbs = totals.carbs * 4;
  const protein = totals.protein * 4;
  const total = fat + carbs + protein || 1;
  return {
    fat,
    carbs,
    protein,
    total,
    fatPct: fat / total * 100,
    carbsPct: carbs / total * 100,
    proteinPct: protein / total * 100
  };
}

function foodKey(item) {

}

function foodLibrary() {
  const map = new Map();
  const deleted = new Set(state.deletedFoodKeys || []);
  DATA.forEach((phase) => {
    phase.items.forEach((item) => {
      const key = foodKey(item);
      if (deleted.has(key)) return;
      if (!map.has(key)) map.set(key, { ...item, sources: [phase.name] });
      else map.get(key).sources.push(phase.name);
    });
  });
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
}

function normalizedFoodName(value) {
  return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function duplicateFoodNameKey(value) {
  let name = normalizedFoodName(canonicalName(value));
  if (name.includes("proteinpowder")) return "proteinpowder";
  if (name.includes("cottagecheese")) return "cottagecheese";
  if (name.includes("pintobean")) return "pintobeans";
  if (name.includes("ricecake")) return "ricecake";
  const aliases = {
    proteinpwd: "proteinpowder",
    proteinpowder: "proteinpowder",
    pb2: "pbpowder",
    pbpowder: "pbpowder",
    potatoes: "potato",
    pototaoes: "potato",
    russetpotato: "potato",
    russetpot: "potato",
    greenpepper: "pepper",
    peppers: "pepper",
    onions: "onion",
    eggs: "egg",
    eggwhite: "eggwhites",
    blueberry: "blueberries",
    blueberries: "blueberries",
    strawberry: "strawberries",
    strawberries: "strawberries",
    cottagech: "cottagecheese",
    cottagechse: "cottagecheese"
  };
  if (aliases[name]) return aliases[name];
  if (name.endsWith("ies") && name.length > 4) name = `${name.slice(0, -3)}y`;
  else if (name.endsWith("es") && name.length > 4) name = name.slice(0, -2);
  else if (name.endsWith("s") && name.length > 3) name = name.slice(0, -1);
  return aliases[name] || name;
}

function findTemplateFood(component) {
  const library = foodLibrary();
  const preferredKey = state.mealFoodKeys?.[normalizedFoodName(component.name)];
  if (preferredKey) {
    const preferred = library.find((item) => foodKey(item) === preferredKey);
    if (preferred) return preferred;
  }
  return library.find((item) => mealComponentMatchesItem(component, item));
}

function ensureMealTemplateFoods() {
  const bank = foodBankPhase();
  if (!bank) return;
  const library = foodLibrary();
  const deleted = new Set(state.deletedFoodKeys || []);
  const missing = TEMPLATE_FOOD_DEFAULTS.filter((food) => {
    const foodName = normalizedFoodName(food.name);
    return !deleted.has(foodKey({ ...food, servings: 0 })) && !library.some((item) => normalizedFoodName(item.name) === foodName);
  });
  if (missing.length) {
    missing.forEach((food) => {
      bank.items.push({
        id: `${slug(food.name)}-meal-bank-${Date.now()}-${bank.items.length}`,
        servings: 0,
        ...food
      });
    });
    saveData();
  }
  bank.__seededMealFoods = true;
}

function mealComponentMatchesItem(component, item) {
  const itemName = normalizedFoodName(item.name);
  return component.aliases.some((alias) => {
    const aliasName = normalizedFoodName(alias);
    return itemName === aliasName || (aliasName.length > 3 && itemName.includes(aliasName));
  });
}

function componentMatchesFood(component, item) {
  const itemName = normalizedFoodName(item.name);
  const componentName = normalizedFoodName(component.name);
  return componentName === itemName || mealComponentMatchesItem({ ...component, aliases: [...(component.aliases || []), component.name] }, item);
}

function slotTotals(slot) {
  return mealInstancesForSlot(slot).reduce((totals, instance) => {
    const meal = mealById(instance.mealId);
    if (!meal) return totals;
    const mealTotals = mealMacroTotals(mealMatchesFor(instance.id, meal));
    totals.calories += mealTotals.calories;
    totals.fat += mealTotals.fat;
    totals.carbs += mealTotals.carbs;
    totals.protein += mealTotals.protein;
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0 });
}

function deleteFoodFromBank(itemKey) {
  const libraryItem = foodLibrary().find((item) => foodKey(item) === itemKey);
  if (!libraryItem) return false;
  let removed = false;
  state.deletedFoodKeys = [...new Set([...(state.deletedFoodKeys || []), itemKey])];
  DATA.forEach((phase) => {
    const before = phase.items.length;
    phase.items = phase.items.filter((item) => foodKey(item) !== itemKey);
    if (phase.items.length !== before) removed = true;
  });
  const customMealIdsBefore = new Set(state.customMeals.map((meal) => meal.id));
  state.customMeals = state.customMeals.map((meal) => ({
    ...meal,
    items: meal.items.filter((component) => !componentMatchesFood(component, libraryItem))
  })).filter((meal) => meal.items.length);
  const customMealIdsAfter = new Set(state.customMeals.map((meal) => meal.id));
  const removedMealIds = [...customMealIdsBefore].filter((mealId) => !customMealIdsAfter.has(mealId));
  if (removedMealIds.length) {
    Object.keys(state.mealSlots).forEach((slot) => {
      state.mealSlots[slot] = mealInstancesForSlot(slot).filter((instance) => !removedMealIds.includes(instance.mealId));
    });
    localStorage.setItem(MEAL_SLOT_KEY, JSON.stringify(state.mealSlots));
  }
  Object.keys(state.mealServings).forEach((key) => {
    if (key.endsWith(`::${slug(libraryItem.name)}`)) delete state.mealServings[key];
  });
  Object.entries(state.mealFoodKeys || {}).forEach(([componentKey, linkedKey]) => {
    if (linkedKey === itemKey) delete state.mealFoodKeys[componentKey];
  });
  saveData();
  saveCustomMeals();
  localStorage.setItem(MEAL_PLAN_KEY, JSON.stringify(state.mealServings));
  localStorage.setItem(DELETED_FOOD_KEY, JSON.stringify(state.deletedFoodKeys));
  localStorage.setItem(MEAL_FOOD_KEY, JSON.stringify(state.mealFoodKeys));
  return removed;
}

function editFoodInBank(oldKey, itemData) {
  const oldItem = foodLibrary().find((item) => foodKey(item) === oldKey);
  if (!oldItem) return false;
  const usedComponents = [];
  savedMeals().forEach((meal) => {
    meal.items.forEach((component) => {
      const matched = findTemplateFood(component);
      if (matched && foodKey(matched) === oldKey) usedComponents.push(component);
    });
  });
  let updated = false;
  DATA.forEach((phase) => {
    phase.items = phase.items.map((item) => {
      if (foodKey(item) !== oldKey) return item;
      updated = true;
      return { ...item, ...itemData, id: item.id };
    });
  });
  if (!updated) {
    foodBankPhase().items.push({ ...itemData, id: `${slug(itemData.name)}-${Date.now()}` });
  }
  const newKey = foodKey(itemData);
  usedComponents.forEach((component) => {
    state.mealFoodKeys[normalizedFoodName(component.name)] = newKey;
  });
  state.deletedFoodKeys = (state.deletedFoodKeys || []).filter((key) => key !== oldKey && key !== newKey);
  saveData();
  localStorage.setItem(MEAL_FOOD_KEY, JSON.stringify(state.mealFoodKeys));
  localStorage.setItem(DELETED_FOOD_KEY, JSON.stringify(state.deletedFoodKeys));
  return true;
}

function mealUsageForFood(item) {
  const itemKey = foodKey(item);
  const meals = savedMeals().filter((meal) => meal.items.some((component) => {
    const matched = findTemplateFood(component);
    return matched && foodKey(matched) === itemKey;
  }));
  return meals.map((meal) => meal.name);
}

function saveFoodPins() {

}

function trackRecentFood(item) {

}

function renderPinnedFoods() {

  const recents = (state.recentFoods || []).map((key) => library.find((item) => foodKey(item) === key)).filter(Boolean);

function currentGroceryList() {
  const totals = new Map();
  MEAL_PLAN_SLOTS.forEach((slot) => {
    mealInstancesForSlot(slot).forEach((instance) => {
      const meal = mealById(instance.mealId);
      if (!meal) return;
      mealMatchesFor(instance.id, meal).forEach((match) => {
        const key = foodKey(match.item);
        const existing = totals.get(key) || { name: match.item.name, servings: 0 };
        existing.servings += match.servings;
        totals.set(key, existing);
      });
    });
  });
  return [...totals.values()].sort((a, b) => a.name.localeCompare(b.name));
}

function groceryListForDays(days = state.groceryDays) {

  return currentGroceryList().map((entry) => ({

  }));

function groceryExportText(days = state.groceryDays) {

function saveWeeklyPlans() {

}

function cloneMealPlanState() {

  };
}

function planHasMeals(plan) {
  return MEAL_PLAN_SLOTS.some((slot) => Array.isArray(plan?.mealSlots?.[slot]) && plan.mealSlots[slot].length);
}

function weekStart(date = new Date()) {
  const copy = new Date(date);
  copy.setHours(0, 0, 0, 0);
  const day = copy.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  copy.setDate(copy.getDate() + diff);
  return copy;
}

function addDays(date, days) {
  const copy = new Date(date);
  copy.setDate(copy.getDate() + days);
  return copy;
}

function shortDateLabel(dateKey) {
  const date = new Date(`${dateKey}T00:00:00`);
  return date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function weekDateKeys(start = weekStart()) {
  return Array.from({ length: 7 }, (_, index) => isoDate(addDays(start, index)));
}

function matchesForPlanInstance(instanceId, meal, servingsMap = {}) {
  return meal.items.map((component) => {
    const item = findTemplateFood(component);
    if (!item) return null;
    const key = mealServingKey(instanceId, component);
    return {
      item,
      component,
      key,
      servings: servingsMap[key] ?? component.servings ?? 0
    };
  }).filter(Boolean);
}

function totalsForMealPlan(plan) {
  return MEAL_PLAN_SLOTS.reduce((totals, slot) => {
    const instances = Array.isArray(plan?.mealSlots?.[slot]) ? plan.mealSlots[slot] : [];
    instances.forEach((instance) => {
      const meal = mealById(instance.mealId);
      if (!meal) return;
      const matches = matchesForPlanInstance(instance.id, meal, plan.mealServings || {});
      const mealTotals = mealMacroTotals(matches);
      totals.calories += mealTotals.calories;
      totals.fat += mealTotals.fat;
      totals.carbs += mealTotals.carbs;
      totals.protein += mealTotals.protein;
      totals.servings += matches.reduce((sum, match) => sum + match.servings, 0);
    });
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0, servings: 0 });
}

function weeklyTotals(dateKeys = weekDateKeys()) {
  return dateKeys.reduce((totals, dateKey) => {
    const dayTotals = totalsForMealPlan(state.weeklyPlans?.[dateKey]);
    totals.calories += dayTotals.calories;
    totals.fat += dayTotals.fat;
    totals.carbs += dayTotals.carbs;
    totals.protein += dayTotals.protein;
    totals.servings += dayTotals.servings;
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0, servings: 0 });
}

function weeklyGroceryList(dateKeys = weekDateKeys()) {

  dateKeys.forEach((dateKey) => {

    MEAL_PLAN_SLOTS.forEach((slot) => {

        matchesForPlanInstance(instance.id, meal, plan.mealServings || {}).forEach((match) => {

        });

  return [...totals.values()].sort((a, b) => a.name.localeCompare(b.name));
}

function applySpecificFoodCleanup() {
  let changed = false;
  const isPlainRiceItem = (name) => ["rice", "whiterice", "brownrice", "jasminerice"].includes(normalizedFoodName(name));
  DATA.forEach((phase) => {
    const cleanedItems = [];
    phase.items.forEach((item) => {
      const nameKey = duplicateFoodNameKey(item.name);
      const exactName = normalizedFoodName(item.name);
      const calories = parseNumber(item.calories);
      const updated = { ...item };
      let remove = false;

      if (nameKey === "proteinpowder") {
        if (calories === 147) {
          updated.name = "Choc. Cake Protein Powder";
          updated.category = "Supplements";
        } else {
          remove = true;
        }
      }

      if (nameKey === "banana") {
        updated.name = "Banana";
        updated.category = "Fruit";
        updated.calories = 110;
      }

      if (nameKey === "cottagecheese") {
        updated.name = "Low Fat Cottage Cheese";
        updated.category = "Dairy";
        updated.calories = 90;
      }

      if (nameKey === "beans" || nameKey === "pintobean" || nameKey === "pintobeans") {
        updated.name = "Pinto Beans";
        updated.category = "Vegetables";
        updated.calories = 90;
        updated.fat = 0.5;
        updated.carbs = 18;
        updated.protein = 6;
      }

      if (exactName === "carrots" || exactName === "carrot" || exactName === "other") remove = true;
      if (isPlainRiceItem(item.name) && calories !== 160) remove = true;

      if (remove) {
        changed = true;
        return;
      }
      if (JSON.stringify(updated) !== JSON.stringify(item)) changed = true;
      cleanedItems.push(updated);
    });
    phase.items = cleanedItems;
  });

  const library = foodLibrary();
  const linkTargets = [
    ["Protein Powder", (item) => duplicateFoodNameKey(item.name) === "proteinpowder" && parseNumber(item.calories) === 147],
    ["Banana", (item) => duplicateFoodNameKey(item.name) === "banana" && parseNumber(item.calories) === 110],
    ["Pinto Beans", (item) => duplicateFoodNameKey(item.name) === "pintobeans" || duplicateFoodNameKey(item.name) === "pintobean" || (duplicateFoodNameKey(item.name) === "beans" && parseNumber(item.calories) === 90)],
    ["Cottage Cheese", (item) => duplicateFoodNameKey(item.name) === "cottagecheese" && parseNumber(item.calories) === 90]
  ];
  linkTargets.forEach(([componentName, matcher]) => {
    const target = library.find(matcher);
    if (!target) return;
    state.mealFoodKeys[normalizedFoodName(componentName)] = foodKey(target);
  });

  if (changed) {
    state.deletedFoodKeys = (state.deletedFoodKeys || []).filter((key) => {
      const [name, calories] = key.split("|");
      const nameKey = duplicateFoodNameKey(name);
      if (nameKey === "proteinpowder" && Number(calories) !== 147) return false;
      if (name === "carrots" || name === "carrot" || name === "other") return false;
      if (isPlainRiceItem(name) && Number(calories) !== 160) return false;
      return true;
    });
    saveData();
    localStorage.setItem(DELETED_FOOD_KEY, JSON.stringify(state.deletedFoodKeys));
  }
  localStorage.setItem(MEAL_FOOD_KEY, JSON.stringify(state.mealFoodKeys));
}

function cleanupUnusedMealDuplicates() {
  const groups = new Map();
  foodLibrary().forEach((item) => {
    const key = duplicateFoodNameKey(item.name);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  });
  const removeKeys = [];
  groups.forEach((items) => {
    if (items.length < 2) return;
    const usedItems = items.filter((item) => mealUsageForFood(item).length);
    if (!usedItems.length) return;
    items.forEach((item) => {
      if (!mealUsageForFood(item).length) removeKeys.push(foodKey(item));
    });
  });
  if (!removeKeys.length) return 0;
  state.deletedFoodKeys = [...new Set([...(state.deletedFoodKeys || []), ...removeKeys])];
  DATA.forEach((phase) => {
    phase.items = phase.items.filter((item) => !removeKeys.includes(foodKey(item)));
  });
  saveData();
  localStorage.setItem(DELETED_FOOD_KEY, JSON.stringify(state.deletedFoodKeys));
  return removeKeys.length;
}

function mealServingKey(instanceId, component) {
  return `${instanceId}::${slug(component.name)}`;
}

function getMealServing(instanceId, component) {
  const key = mealServingKey(instanceId, component);
  return state.mealServings[key] ?? component.servings ?? 0;
}

function todayKey() {
  return isoDate(new Date());
}

function currentDayLog(dateKey = todayKey()) {
  state.dayLog[dateKey] = state.dayLog[dateKey] || {};
  state.dayLog[dateKey].doneMeals = state.dayLog[dateKey].doneMeals || {};
  state.dayLog[dateKey].mealOverrides = state.dayLog[dateKey].mealOverrides || {};
  return state.dayLog[dateKey];
}

function saveDayLog() {
  localStorage.setItem(DAY_LOG_KEY, JSON.stringify(state.dayLog));
}

function getEffectiveMealServing(instanceId, component) {
  const key = mealServingKey(instanceId, component);
  const day = currentDayLog();
  return day.mealOverrides[key] ?? state.mealServings[key] ?? component.servings ?? 0;
}

function setMealServing(key, value) {
  const parsed = Math.max(0, Math.round(parseNumber(value) * 10) / 10);
  state.mealServings[key] = parsed;
  localStorage.setItem(MEAL_PLAN_KEY, JSON.stringify(state.mealServings));
  if (state.view === "meal" || state.view === "phase") renderMealPlan();
  else {
    renderSummary();
    renderItems();
  }
}

function mealMacroTotals(matches) {
  return matches.reduce((totals, match) => {
    totals.calories += match.item.calories * match.servings;
    totals.fat += match.item.fat * match.servings;
    totals.carbs += match.item.carbs * match.servings;
    totals.protein += match.item.protein * match.servings;
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0 });
}

function mealMatchesFor(instanceId, meal) {
  return meal.items.map((component) => {
    const item = findTemplateFood(component);
    if (!item) return null;
    return {
      item,
      component,
      key: mealServingKey(instanceId, component),
      servings: getEffectiveMealServing(instanceId, component)
    };
  }).filter(Boolean);
}

function mealInstancesForSlot(slot) {
  const raw = state.mealSlots[slot];
  if (Array.isArray(raw)) return raw;
  if (typeof raw === "string" && raw) {
    const migrated = [{ id: `${slug(slot)}-${slug(raw)}-legacy`, mealId: raw }];
    state.mealSlots[slot] = migrated;
    localStorage.setItem(MEAL_SLOT_KEY, JSON.stringify(state.mealSlots));
    return migrated;
  }
  return [];
}

function dailyMealTotals() {
  return MEAL_PLAN_SLOTS.reduce((totals, slot) => {
    mealInstancesForSlot(slot).forEach((instance) => {
      const meal = mealById(instance.mealId);
      if (!meal) return;
      const matches = mealMatchesFor(instance.id, meal);
      const mealTotals = mealMacroTotals(matches);
      totals.calories += mealTotals.calories;
      totals.fat += mealTotals.fat;
      totals.carbs += mealTotals.carbs;
      totals.protein += mealTotals.protein;
      totals.servings += matches.reduce((sum, match) => sum + match.servings, 0);
    });
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0, servings: 0 });
}

function todayMealTotals() {
  return dailyMealTotals();
}

function snapshotTodayNutrition() {
  const day = currentDayLog();
  day.nutrition = todayMealTotals();
  saveDayLog();
}

function mealItemRow(match) {

          <button class="mini" data-today-meal-step="0.5" data-meal-key="${esc(match.key)}">+</button>
        </div>

function foodGroup(item) {
  const rawCategory = String(item.category || "").toLowerCase();
  const name = String(item.name || "").toLowerCase();
  const text = `${rawCategory} ${name}`;
  if (/\b(protein powder|protein pwd|pb powder|pb2|supplement)\b/.test(text)) return "Supplements";
  if (/\b(egg|eggs|egg white|chicken|turkey|tky|grd tky|ground turk|ground beef|beef|meat)\b/.test(text)) return "Protein";
  if (/\b(milk|almond milk|yogurt|greek yogurt|cottage|cheese|dairy)\b/.test(text)) return "Dairy";
  if (/\b(rice|cream of rice|grits|oat|oatmeal|pasta|bagel|bagels|bread|popcorn|rice cake|pot|russet|grain|granola)\b/.test(text)) return "Grains & Starches";
  if (/\b(banana|blueberries|berries|strawberries|mango|raisins|fruit|bb|frozen fruit)\b/.test(text)) return "Fruit";
  if (/\b(spinach|broc|broccoli|broccili|broccli|tom|tomato|crushed tom|petite diced|pepper|onion|beans|pinto|pinot|green beans|corn|carrot|squash|zucchini|zuccini|veg|vegs)\b/.test(text)) return "Vegetables";
  if (/\b(ketchup|sauce|marina|marinara|broth|misc|other)\b/.test(text)) return "Fats, Sauces & Extras";
  return "Other";
}

function groupedListHtml(phase, items, options = {}) {
  if (!items.length) return "";
  const groups = new Map(GROUP_ORDER.map((group) => [group, []]));
  items.forEach((item) => {
    const group = foodGroup(item);
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(item);
  });
  return [...groups.entries()]
    .filter(([, groupItems]) => groupItems.length)
    .map(([group, groupItems]) => `
      <div class="food-group">${esc(group)}</div>
      ${groupItems.map((item) => itemCard(phase, item, options)).join("")}
    `)
    .join("");
}

function mealListHtml(phase, items) {

}

function itemCard(phase, item, options = {}) {
  const servings = getServings(phase, item);
  const weeklyCal = item.calories * servings;
  const dailyCal = weeklyCal / 7;
  const isLibrary = options.library;
  const mealUsage = options.bankDelete ? mealUsageForFood(item) : [];
  const sourceText = options.bankDelete
    ? (mealUsage.length ? `Used in ${mealUsage.slice(0, 3).join(", ")}${mealUsage.length > 3 ? ` +${mealUsage.length - 3} more` : ""}` : "Not used in saved meals")
    : (item.sources?.length ? `From ${item.sources.slice(0, 2).join(", ")}` : "From library");
  const isFavoriteFood = (state.favoriteFoods || []).includes(foodKey(item));
  const libraryAction = options.bankDelete
    ? `<div class="library-actions"><button class="mini favorite-food ${isFavoriteFood ? "active" : ""}" data-toggle-food-favorite="${esc(foodKey(item))}" title="Favorite">${isFavoriteFood ? "Starred" : "Star"}</button><button class="mini" data-edit-bank-food="${esc(foodKey(item))}">Edit</button><button class="mini danger" data-delete-bank-food="${esc(foodKey(item))}">Delete</button></div>`
    : `<button class="mini add" data-add-library="${esc(item.id)}">Add</button>`;
  return `
    <article class="item">
      <div class="item-head">
        <div>
          <div class="item-name">${esc(item.name)}</div>
          <div class="item-cat">${esc(isLibrary ? sourceText : (item.category || "Per serving"))} - ${fmt(item.calories)} cal</div>
          ${options.mealServing ? `<span class="meal-plan">Meal plan: ${fmt(options.mealServing)} serving${Number(options.mealServing) === 1 ? "" : "s"}</span>` : ""}
        </div>
        ${isLibrary ? libraryAction : `

function renderSummary() {

    return `
      <div class="goal-card ${status}">

function isoDate(date) {
  return date.toISOString().slice(0, 10);
}

function ageFromBirthDate(birthDate) {
  if (!birthDate) return 0;
  const birth = new Date(`${birthDate}T00:00:00`);
  if (Number.isNaN(birth.getTime())) return 0;
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const beforeBirthday = now.getMonth() < birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate());
  if (beforeBirthday) age -= 1;
  return Math.max(0, age);
}

function bmrValue(profile) {
  const age = ageFromBirthDate(profile.birthDate);
  const weightLb = parseNumber(profile.currentWeight);
  const feet = parseNumber(profile.heightFeet);
  const inches = parseNumber(profile.heightInches);
  const heightIn = feet * 12 + inches;
  if (!age || !weightLb || !heightIn || !profile.gender) return 0;
  const kg = weightLb / 2.20462;
  const cm = heightIn * 2.54;
  return profile.gender === "female"
    ? (10 * kg) + (6.25 * cm) - (5 * age) - 161
    : (10 * kg) + (6.25 * cm) - (5 * age) + 5;
}

function trainingStreak() {
  let streak = 0;
  const day = new Date();
  for (let i = 0; i < 365; i += 1) {
    const key = isoDate(day);
    const entry = state.trainingLog[key] || {};
    if (entry.gym || entry.cardio) streak += 1;
    else break;
    day.setDate(day.getDate() - 1);
  }
  return streak;
}

function trainingCounts() {
  return Object.values(state.trainingLog).reduce((totals, entry) => {
    if (entry.gym) totals.gym += 1;
    if (entry.cardio) totals.cardio += 1;
    return totals;
  }, { gym: 0, cardio: 0 });
}

function monthKeyFromDate(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}

function monthLabel(monthKey) {
  const [year, month] = monthKey.split("-").map(Number);
  return new Date(year, month - 1, 1).toLocaleString(undefined, { month: "long", year: "numeric" });
}

function monthlyTrainingTotals() {
  const start = new Date(2026, 6, 1);
  const current = new Date();
  const end = new Date(current.getFullYear(), current.getMonth(), 1);
  const totals = new Map();
  const cursor = new Date(start);
  while (cursor <= end) {
    totals.set(monthKeyFromDate(cursor), { gym: 0, cardio: 0 });
    cursor.setMonth(cursor.getMonth() + 1);
  }
  Object.entries(state.trainingLog).forEach(([dateKey, entry]) => {
    const monthKey = dateKey.slice(0, 7);
    if (!totals.has(monthKey)) totals.set(monthKey, { gym: 0, cardio: 0 });
    const total = totals.get(monthKey);
    if (entry.gym) total.gym += 1;
    if (entry.cardio) total.cardio += 1;
  });
  return [...totals.entries()].sort(([a], [b]) => a.localeCompare(b));
}

  const rows = monthlyTrainingTotals().map(([monthKey, totals]) => `
    <div class="month-row">
      <strong>${monthLabel(monthKey)}</strong>

      <span class="month-pill cardio">C ${totals.cardio}</span>

function dayNutritionTotals(dateKey) {
  if (dateKey === todayKey()) return todayMealTotals();
  return state.dayLog[dateKey]?.nutrition || { calories: 0, fat: 0, carbs: 0, protein: 0 };

function recentNutritionDays(limit = 7) {
  const keys = Object.keys(state.dayLog)
    .filter((key) => state.dayLog[key]?.nutrition)
    .sort()
    .reverse();
  if (!keys.includes(todayKey())) keys.unshift(todayKey());
  return [...new Set(keys)].slice(0, limit);
}

    .map(([date, weight]) => ({ date, weight: parseNumber(weight) }))

    .sort((a, b) => a.date.localeCompare(b.date));
}

function renderWeightTracker() {
  const entries = weightEntries();
  const recent = entries.slice(-12);
  const values = recent.map((entry) => entry.weight);
  const min = Math.min(...values, parseNumber(state.profileData?.currentWeight) || 0);
  const max = Math.max(...values, parseNumber(state.profileData?.currentWeight) || 1);
  const span = Math.max(1, max - min);
  const points = recent.map((entry, index) => {
    const x = recent.length === 1 ? 50 : 8 + (index / (recent.length - 1)) * 84;
    const y = 86 - ((entry.weight - min) / span) * 68;
    return `${x},${y}`;
  }).join(" ");
  const latest = entries[entries.length - 1];
  const first = entries[0];
  const change = latest && first ? latest.weight - first.weight : 0;
  return `
    <section class="mini-panel">
      <div class="panel-title-row"><h2>Weight Trend</h2><span>${latest ? `${fmt(latest.weight)} lb` : "No logs yet"}</span></div>
      <form class="inline-form" data-weight-form>
        <input name="weight" inputmode="decimal" placeholder="Today's weight" value="${esc(state.weightLog[todayKey()] || "")}">
        <button class="primary" type="submit">Save</button>
      </form>
      <svg class="sparkline" viewBox="0 0 100 100" role="img" aria-label="Weight trend">
        <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline>
        ${recent.map((entry, index) => {
          const [x, y] = (points.split(" ")[index] || "50,50").split(",");
          return `<circle cx="${x}" cy="${y}" r="3" fill="var(--gold)"></circle>`;
        }).join("")}
      </svg>
      <p>${entries.length > 1 ? `${change >= 0 ? "+" : ""}${fmt(change)} lb since first log` : "Add a few entries to see the trend."}</p>
    </section>
  `;
}

function renderProgressSummary() {
  const sevenAgo = new Date();
  sevenAgo.setDate(sevenAgo.getDate() - 6);
  let gym = 0;
  let cardio = 0;
  let calories = 0;
  let protein = 0;
  let nutritionDays = 0;
  for (let i = 0; i < 7; i += 1) {
    const date = new Date(sevenAgo);
    date.setDate(sevenAgo.getDate() + i);
    const key = isoDate(date);
    const training = state.trainingLog[key] || {};
    if (training.gym) gym += 1;
    if (training.cardio) cardio += 1;
    const nutrition = dayNutritionTotals(key);
    if (nutrition.calories || nutrition.protein) {
      calories += nutrition.calories;
      protein += nutrition.protein;
      nutritionDays += 1;
    }
  }
  return `
    <section class="stat-grid training-stats">
      <div class="metric"><span>7-Day Gym</span><strong>${gym}</strong></div>
      <div class="metric"><span>7-Day Cardio</span><strong>${cardio}</strong></div>
      <div class="metric"><span>Avg Calories</span><strong>${nutritionDays ? fmt(calories / nutritionDays) : "--"}</strong></div>
      <div class="metric"><span>Avg Protein</span><strong>${nutritionDays ? fmt(protein / nutritionDays) + "g" : "--"}</strong></div>
    </section>
  `;
}

function renderTrainingCalendar() {
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const first = new Date(year, month, 1);
  const days = new Date(year, month + 1, 0).getDate();
  const blanks = first.getDay();
  const cells = [];
  for (let i = 0; i < blanks; i += 1) cells.push(`<div class="cal-cell muted"></div>`);
  for (let day = 1; day <= days; day += 1) {
    const date = new Date(year, month, day);
    const key = isoDate(date);
    const entry = state.trainingLog[key] || {};
    const active = entry.gym || entry.cardio;
    cells.push(`
      <button type="button" class="cal-cell ${active ? "active" : ""}" data-training-day="${key}">
        <span>${day}</span>
        <small>${entry.gym ? "G" : ""}${entry.cardio ? "C" : ""}</small>
      </button>
    `);
  }
  return `
    <section class="home-hero">
      <h2>${today.toLocaleString(undefined, { month: "long" })} Training</h2>
      <p>Tap a day to mark gym and/or cardio.</p>
      <div class="cal-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="calendar-grid">${cells.join("")}</div>
      ${renderMonthlyTrainingSummary()}
    </section>
  `;
}

function renderHomeSnapshot() {
  const totals = dailyMealTotals();
  const targets = { ...DEFAULT_TARGETS, ...(currentPhase()?.targets || {}) };
  const cards = [
    ["Calories", totals.calories, targets.calories, "", "var(--accent)"],
    ["Fat", totals.fat, targets.fat, "g", "var(--gold)"],
    ["Carbs", totals.carbs, targets.carbs, "g", "var(--blue)"],
    ["Protein", totals.protein, targets.protein, "g", "var(--accent-dark)"]
  ];
  return `
    <section class="home-snapshot">
      <h2>Today's Macro Snapshot</h2>
      <p>Synced with your current Meal Plan totals.</p>
      <div class="snapshot-grid">
        ${cards.map(([label, actual, target, unit, color]) => {
          const fill = target > 0 ? Math.min(actual / target * 100, 100) : 0;
          return `
            <div class="snapshot-card" style="--snap-fill:${fill}%; --snap-color:${color}">
              <div class="snapshot-donut" aria-hidden="true"></div>
              <span>${label}</span>
              <strong>${fmt(actual)}${unit} / ${target ? fmt(target) + unit : "--"}</strong>

}

function goalGuidance(profile, age, bmr) {
  const weight = parseNumber(profile.currentWeight);
  const gender = profile.gender || "";
  const goal = profile.goal || "Maintain";
  const protein = weight ? Math.round(weight * (goal === "Gain muscle" || goal === "Gain weight" ? 1.05 : goal === "Improve conditioning" ? 1 : 0.9)) : 0;
  const waterOz = weight ? Math.round(Math.min(140, Math.max(80, weight * (gender === "female" ? 0.55 : 0.6)))) : 0;
  const recovery = age >= 45 ? "2 mobility/recovery days" : age >= 35 ? "1-2 recovery days" : "1 recovery day";
  const base = {
    "Lose weight": [
      ["Protein", protein ? `${protein}g/day target` : "0.8-1g per lb"],
      ["Cardio", "8k-10k steps + 2-3 cardio days"],
      ["Calories", bmr ? `Use meal goals near BMR + activity` : "Keep a steady deficit"],
      ["Hydration", waterOz ? `${waterOz} oz water/day` : "3-4 liters water/day"]
    ],
    "Gain muscle": [
      ["Protein", protein ? `${protein}g/day target` : "1g per lb"],
      ["Training", "4-5 progressive lifting days"],
      ["Calories", "Small surplus, steady weekly gain"],
      ["Recovery", `${recovery}, 7-9 hr sleep`]
    ],
    "Gain weight": [
      ["Protein", protein ? `${protein}g/day target` : "1g per lb"],
      ["Calories", "Add 250-400 cal/day first"],
      ["Carbs", "Push carbs around workouts"],
      ["Tracking", "Aim 0.5-1 lb gain/week"]
    ],
    "Maintain": [
      ["Protein", protein ? `${protein}g/day target` : "0.8-1g per lb"],
      ["Training", "3-4 lifts + 2 light cardio days"],
      ["Calories", "Keep weekly average steady"],
      ["Hydration", waterOz ? `${waterOz} oz water/day` : "3-4 liters water/day"]
    ],
    "Improve conditioning": [
      ["Cardio", "10 miles cardio/week"],
      ["Protein", protein ? `${protein}g/day target` : "1g per lb"],
      ["Hydration", waterOz ? `${waterOz} oz + electrolytes` : "1 gallon water + electrolytes"],
      ["Recovery", `${recovery}, easy days stay easy`]
    ]
  };
  return base[goal] || base.Maintain;
}

function cheatTotals() {
  return MEAL_SLOTS.flatMap((slot) => state.cheatEntries[slot] || []).reduce((totals, item) => {

    totals.calories += item.calories * servings;
    totals.fat += item.fat * servings;
    totals.carbs += item.carbs * servings;
    totals.protein += item.protein * servings;
    return totals;
  }, { calories: 0, fat: 0, carbs: 0, protein: 0 });
}

function renderMealPlanSummary() {

  const goalCard = (label, actual, target, unit = "") => {
    const fill = target > 0 ? Math.min(actual / target * 100, 120) : 0;
    const remaining = target > 0 ? target - actual : 0;

    const remainingText = target > 0 ? `${remaining >= 0 ? fmt(remaining) + unit + " left" : fmt(Math.abs(remaining)) + unit + " over"}` : "No goal set";
    return `
      <div class="goal-card ${status}">

        <div class="weekly-meals">F ${fmt(dayTotals.fat)}g - C ${fmt(dayTotals.carbs)}g - P ${fmt(dayTotals.protein)}g</div>
        <div class="weekly-actions">
          <button class="ghost" data-week-save-current="${esc(dateKey)}">Save Current</button>
          <button class="ghost" data-week-load-day="${esc(dateKey)}" ${planHasMeals(plan) ? "" : "disabled"}>Load Day</button>

          <button class="primary" data-week-apply-template="${esc(dateKey)}">Apply</button>
        </div>
      </section>
    `;
  };
  document.querySelector("#app").innerHTML = `
    ${topShell("Weekly Plan", `<div class="action-row"><button class="ghost" data-view-target="home">Home</button><button class="ghost" data-view-target="meal">Meal Plan</button></div>`)}
    <section class="summary">
      <div class="metric"><span>Weekly Calories</span><strong>${fmt(totals.calories)}</strong></div>
      <div class="metric"><span>Weekly Protein</span><strong>${fmt(totals.protein)}g</strong></div>
      <div class="metric"><span>Weekly Carbs</span><strong>${fmt(totals.carbs)}g</strong></div>
      <div class="metric"><span>Weekly Fat</span><strong>${fmt(totals.fat)}g</strong></div>
    </section>
    <main class="weekly-grid">
      ${dates.map(dayCard).join("")}
      <section class="slot-card weekly-day">
        <div class="weekly-day-head">
          <div>
            <h3>Weekly Grocery List</h3>
            <span>${grocery.length ? `${grocery.length} food item${grocery.length === 1 ? "" : "s"}` : "No saved weekly meals yet."}</span>
          </div>
        </div>
        ${grocery.length ? grocery.map((entry) => `<div class="weekly-grocery-row"><strong>${esc(entry.name)}</strong><span>${fmt(entry.servings)}</span></div>`).join("") : `<div class="empty">Save or apply meals to the week to build this list.</div>`}
      </section>
    </main>
    <div data-modal-root></div>
  `;
}


function saveMarathonLog() {
  localStorage.setItem(MARATHON_LOG_KEY, JSON.stringify(state.marathonLog || {}));
}

function marathonDateFor(startDate, dayIndex) {
  return isoDate(addDays(new Date(`${startDate}T00:00:00`), dayIndex));
}

function marathonEntry(dateKey) {
  state.marathonLog[dateKey] = state.marathonLog[dateKey] || { miles: "", difficulty: "", note: "" };
  return state.marathonLog[dateKey];
}

function marathonPlannedTotal(week) {
  return MARATHON_DAYS.reduce((sum, day) => sum + (week.runs[day]?.miles || 0), 0);
}

function marathonActualTotal(week) {
  return MARATHON_DAYS.reduce((sum, day, index) => {
    const dateKey = marathonDateFor(week.start, index);
    return sum + parseNumber(state.marathonLog[dateKey]?.miles);
  }, 0);
}

function marathonDifficultyColor(level) {
  return {
    1: "#22c55e",
    2: "#84cc16",
    3: "#facc15",
    4: "#fb923c",
    5: "#ef4444"
  }[Number(level)] || "var(--accent)";
}

function updateMarathonTotalsDisplay() {
  const totalActual = MARATHON_PLAN.reduce((sum, week) => sum + marathonActualTotal(week), 0);
  const totalNode = document.querySelector("[data-marathon-total-actual]");
  if (totalNode) totalNode.textContent = fmt(totalActual);
  MARATHON_PLAN.forEach((week) => {
    const node = document.querySelector(`[data-marathon-week-total="${week.week}"]`);
    if (node) node.textContent = `Planned ${fmt(marathonPlannedTotal(week))} / Actual ${fmt(marathonActualTotal(week))}`;
  });
}

function renderMarathonCell(week, day, index) {
  const dateKey = marathonDateFor(week.start, index);
  const planned = week.runs[day];
  const entry = marathonEntry(dateKey);
  const plannedStyle = planned ? ` style="--planned-difficulty:${marathonDifficultyColor(planned.difficulty)}"` : "";
  return `
    <div class="marathon-cell ${planned ? "planned" : "rest"}"${plannedStyle}>
      <div class="marathon-day-name"><span>${esc(day.slice(0, 3))}</span><span>${esc(dateKey.slice(5))}</span></div>
      <div class="marathon-planned"><strong>Planned</strong><span>${planned ? esc(planned.label) : "Rest / mobility"}</span></div>
      <div class="marathon-actual">
        <strong>Actual</strong>
        <input inputmode="decimal" placeholder="${planned ? "Miles" : "Extra miles"}" value="${esc(entry.miles || "")}" data-marathon-field="miles" data-marathon-date="${esc(dateKey)}">
        <select data-marathon-field="difficulty" data-marathon-date="${esc(dateKey)}">
          <option value="">Difficulty</option>
          ${[1, 2, 3, 4, 5].map((level) => `<option value="${level}" ${String(entry.difficulty || "") === String(level) ? "selected" : ""}>${level}/5</option>`).join("")}
        </select>
        <textarea placeholder="${planned ? "Run note" : "Extra run note"}" data-marathon-field="note" data-marathon-date="${esc(dateKey)}">${esc(entry.note || "")}</textarea>
      </div>
    </div>
  `;
}

function renderMarathonPrep() {
  if (!state.marathonUnlocked) {
    document.querySelector("#app").innerHTML = `
      ${topShell("Marathon Prep", `<button class="ghost" data-view-target="home">Home</button>`)}
      <section class="slot-card marathon-lock">
        <div class="weekly-day-head">
          <div>
            <h3>Locked Personal Calendar</h3>

          </div>

        <form class="lock-row" data-marathon-unlock-form>

  document.querySelector("#app").innerHTML = `
    ${topShell("Marathon Prep", `<button class="ghost" data-view-target="home">Home</button>`)}
    <section class="summary">
      <div class="metric"><span>Plan Starts</span><strong>Jul 6</strong></div>
      <div class="metric"><span>Planned Miles</span><strong>${fmt(totalPlanned)}</strong></div>
      <div class="metric"><span>Actual Miles</span><strong data-marathon-total-actual>${fmt(totalActual)}</strong></div>
      <div class="metric"><span>Weeks</span><strong>${MARATHON_PLAN.length}</strong></div>
    </section>
    <main class="items">
      ${MARATHON_PLAN.map((week) => `
        <section class="slot-card marathon-week">
          <div class="marathon-week-head">
            <h3>Week ${week.week}</h3>
            <span class="meal-total" data-marathon-week-total="${week.week}">Planned ${fmt(marathonPlannedTotal(week))} / Actual ${fmt(marathonActualTotal(week))}</span>
          </div>
          <div class="marathon-scroll">

}
function renderArchiveSummary() {
  const phase = currentPhase();
  if (!phase) return;
  const weekly = totalsFor(phase);
  const daily = {
    calories: weekly.calories / 7,
    fat: weekly.fat / 7,
    carbs: weekly.carbs / 7,
    protein: weekly.protein / 7
  };
  const summary = document.querySelector("[data-summary]");
  const bottom = document.querySelector("[data-bottom]");
  if (summary) {
    summary.innerHTML = `
      <div class="metric"><span>Daily Calories</span><strong>${fmt(daily.calories)}</strong></div>
      <div class="metric"><span>Daily Protein</span><strong>${fmt(daily.protein)}g</strong></div>
      <div class="metric"><span>Weekly Calories</span><strong>${fmt(weekly.calories)}</strong></div>
      <div class="metric"><span>Weekly Servings</span><strong>${fmt(weekly.servings)}</strong></div>
    `;
  }
  if (bottom) {
    bottom.innerHTML = `
      <div class="bottom-cell"><span>Cal</span><strong>${fmt(daily.calories)}</strong></div>
      <div class="bottom-cell"><span>Fat</span><strong>${fmt(daily.fat)}g</strong></div>
      <div class="bottom-cell"><span>Carbs</span><strong>${fmt(daily.carbs)}g</strong></div>
      <div class="bottom-cell"><span>Protein</span><strong>${fmt(daily.protein)}g</strong></div>
    `;
  }
}

function renderArchiveItems() {
  const phase = currentPhase();
  if (!phase) return;
  const query = state.query.trim().toLowerCase();
  const currentMatches = phase.items.filter((item) => (!state.activeOnly || getServings(phase, item) > 0) && (!query || item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query)));
  const list = document.querySelector("[data-items]");
  if (!list) return;
  list.innerHTML = currentMatches.length ? groupedListHtml(phase, currentMatches) : `<div class="empty">No foods in this archived tab match this search.</div>`;
}

function renderArchive() {
  const phase = currentPhase();
  if (!phase) return;
  const isFavorite = state.favoriteIds.includes(phase.id);
  localStorage.setItem("macroPhase", phase.id);
  document.querySelector("#app").innerHTML = `
    <div class="topbar">
      <div class="title-row">
        <h1>Macro Phases</h1>
        <select class="theme-select" data-theme-select aria-label="Color theme">${themeOptions()}</select>
      </div>
      <select class="phase-select" data-select>${phaseOptions(phase)}</select>
      <div class="top-actions">
        <button class="ghost favorite-toggle ${isFavorite ? "active" : ""}" data-toggle-favorite>${isFavorite ? "Favorited" : "Favorite Page"}</button>
        <button class="ghost" data-view-target="home">Home</button>
      </div>
      <div class="tabs">${favoriteTabs(phase)}</div>
    </div>
    <section class="summary" data-summary></section>
    <div class="action-row compact">
      <button class="primary" data-open-add-food>Add Food</button>
      <button class="ghost" data-open-add-tab>Add Tab</button>
      <button class="ghost" data-copy-phase>Copy Tab</button>
      <button class="ghost active-toggle ${state.activeOnly ? "active" : ""}" data-toggle-active>${state.activeOnly ? "Active Only" : "Show All"}</button>
    </div>
    <div class="toolbar">
      <input class="search" type="search" placeholder="Search foods" value="${esc(state.query)}" data-search>
      <button class="ghost" data-clear>Clear</button>
    </div>
    <main class="items" data-items></main>
    <footer class="bottom">
      <div class="bottom-grid" data-bottom></div>
    </footer>

  `;
